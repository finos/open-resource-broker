{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orb.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orb.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# automountServiceAccountToken is omitted here so the pod-level setting takes effect.
# The Deployment sets it to true only when provider.type=k8s.
{{- end }}
