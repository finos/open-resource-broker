{{- include "orb.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # json and sqlite storage are single-writer on a ReadWriteOnce volume, so the old
  # pod must stop before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "orb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Force pod rollout when ConfigMap content changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "orb.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "orb.serviceAccountName" . }}
      # Mount the SA token only when the k8s provider needs it to call the API server.
      # AWS mode gets no token, reducing the blast radius of a container escape.
      automountServiceAccountToken: {{ eq .Values.provider.type "k8s" }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: orb
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "orb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Entrypoint: docker-entrypoint.sh serve
          # -> orb server start --foreground --host HOST --port PORT [--workers N]
          # The entrypoint reads HF_* env vars and invokes `orb server start --foreground`.
          command: ["./docker-entrypoint.sh", "serve"]
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          env:
            # Server
            - name: HF_SERVER_ENABLED
              value: "true"
            - name: HF_SERVER_HOST
              value: {{ .Values.server.host | quote }}
            - name: HF_SERVER_PORT
              value: {{ .Values.server.port | quote }}
            - name: HF_SERVER_WORKERS
              value: {{ .Values.server.workers | quote }}
            - name: HF_SERVER_LOG_LEVEL
              value: {{ .Values.server.serverLogLevel | quote }}
            - name: HF_LOGGING_LEVEL
              value: {{ .Values.server.logLevel | quote }}
            # HF_CONFIG_FILE is set by docker-entrypoint.sh after it finds
            # /app/config/docker.json (highest-precedence scanned path). No override needed.
            {{- if eq .Values.auth.strategy "bearer_token" }}
            # Referenced from the generated config as ${ORB_AUTH_BEARER_SECRET_KEY}.
            - name: ORB_AUTH_BEARER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.existingSecretKey }}
            {{- end }}
            # Provider
            - name: HF_PROVIDER_TYPE
              value: {{ .Values.provider.type | quote }}
            {{- if eq .Values.provider.type "aws" }}
            - name: HF_PROVIDER_AWS_REGION
              value: {{ .Values.provider.aws.region | quote }}
            {{- end }}
            # Read-only root filesystem: keep anything that resolves ~ on a writable path.
            - name: HOME
              value: /app/tmp
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: orb-config
              mountPath: /app/config/docker.json
              subPath: docker.json
              readOnly: true
            - name: orb-data
              mountPath: /app/data
            - name: orb-logs
              mountPath: /app/logs
            - name: orb-tmp
              mountPath: /app/tmp
            - name: orb-work
              mountPath: /app/work
            - name: orb-scratch
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /* /livez never depends on a provider, so a slow or broken provider cannot restart the pod. */}}
          startupProbe:
            httpGet:
              path: {{ include "orb.probePath" (dict "root" . "probe" .Values.probes.startup "default" "/livez") }}
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ include "orb.probePath" (dict "root" . "probe" .Values.probes.liveness "default" "/livez") }}
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ include "orb.probePath" (dict "root" . "probe" .Values.probes.readiness "default" "/readyz") }}
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: orb-config
          configMap:
            name: {{ include "orb.fullname" . }}-config
        # Local state only. With dynamodb storage this is scratch space and nothing in it
        # is authoritative.
        - name: orb-data
          {{- if and (include "orb.localStorage" .) .Values.storage.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "orb.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: orb-logs
          emptyDir: {}
        - name: orb-tmp
          emptyDir: {}
        - name: orb-work
          emptyDir: {}
        - name: orb-scratch
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
