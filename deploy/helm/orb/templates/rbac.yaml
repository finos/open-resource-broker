{{- if .Values.rbac.create -}}
# Namespaced Role — covers pods, deployments, statefulsets, jobs within the
# release namespace.  Mirrors docs/root/providers/k8s/rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orb.labels" . | nindent 4 }}
rules:
  # Core — Pod handler + watch task
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # apps/v1 — Deployment + StatefulSet handlers
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/status", "statefulsets/status"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch"]
  # batch/v1 — Job handler
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orb.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "orb.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "orb.fullname" . }}
{{- end }}
{{- if and .Values.rbac.create .Values.rbac.clusterScoped }}
---
# ClusterRole — required when provider.k8s.namespaces is ["*"] (cluster-scoped
# watch) or when provider.k8s.nodeWatchEnabled is true.
# Nodes are cluster-scoped; a namespaced Role cannot grant access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "orb.fullname" . }}
  labels:
    {{- include "orb.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-scoped-watch
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Nodes — required for node_watch_enabled: true
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/status", "statefulsets/status"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "orb.fullname" . }}
  labels:
    {{- include "orb.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-scoped-watch
subjects:
  - kind: ServiceAccount
    name: {{ include "orb.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "orb.fullname" . }}
{{- end }}
