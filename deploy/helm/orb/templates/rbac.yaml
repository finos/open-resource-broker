{{- if and .Values.rbac.create (eq .Values.provider.type "k8s") }}
{{- $namespaces := include "orb.k8sNamespaces" . | fromJsonArray }}
{{- range $namespace := $namespaces }}
{{- if ne $namespace "*" }}
---
# Namespaced Role — covers pods, deployments, statefulsets, jobs in each
# namespace the provider manages. Mirrors docs/root/providers/k8s/rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orb.fullname" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "orb.labels" $ | nindent 4 }}
rules:
  # Core — Pod handler + watch task
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # apps/v1 — Deployment + StatefulSet handlers
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/status", "statefulsets/status"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch"]
  # batch/v1 — Job handler
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orb.fullname" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "orb.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "orb.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "orb.fullname" $ }}
{{- end }}
{{- end }}
{{- end }}
{{- $wildcard := has "*" (include "orb.k8sNamespaces" . | fromJsonArray) }}
{{- $nodeWatch := .Values.provider.k8s.nodeWatchEnabled }}
{{- if and .Values.rbac.create .Values.rbac.clusterScoped (eq .Values.provider.type "k8s") (or $wildcard $nodeWatch) }}
---
# ClusterRole — only what the configuration needs beyond the per-namespace Roles:
# provider.k8s.namespaces ["*"] watches every namespace and gets the full rule set;
# nodeWatchEnabled alone adds read access to nodes, which are cluster-scoped. Explicit
# namespaces never get cluster-wide access to workloads.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "orb.fullname" . }}
  labels:
    {{- include "orb.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-scoped-watch
rules:
{{- if $wildcard }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/status", "statefulsets/status"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]
{{- end }}
{{- if $nodeWatch }}
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "orb.fullname" . }}
  labels:
    {{- include "orb.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-scoped-watch
subjects:
  - kind: ServiceAccount
    name: {{ include "orb.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "orb.fullname" . }}
{{- end }}
