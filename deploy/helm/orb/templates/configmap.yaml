apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orb.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orb.labels" . | nindent 4 }}
data:
  # Mounted at /app/config/docker.json — the highest-precedence path scanned by
  # docker-entrypoint.sh setup_configuration() (docker.json > production.json > default_config.json).
  # This ensures the entrypoint sets HF_CONFIG_FILE to this file and the app boots
  # from the chart-generated config, not the baked-in default_config.json.
  docker.json: |
    {
      "version": "2.0.0",
      "scheduler": {
        "type": "default"
      },
      "provider": {
        "providers": [
          {
            "name": "{{ .Values.provider.type }}-default",
            "type": {{ .Values.provider.type | quote }},
            "enabled": true,
            "weight": 100,
            "config": {
              {{- if eq .Values.provider.type "k8s" }}
              "in_cluster": true,
              "namespace": {{ include "orb.k8sDefaultNamespace" . | quote }},
              "namespaces": {{ include "orb.k8sNamespaces" . }},
              "node_watch_enabled": {{ .Values.provider.k8s.nodeWatchEnabled }}
              {{- else if eq .Values.provider.type "aws" }}
              "region": {{ .Values.provider.aws.region | quote }}
              {{- if .Values.provider.aws.profile }},
              "profile": {{ .Values.provider.aws.profile | quote }}
              {{- end }}
              {{- end }}
            }
          }
        ],
        "selection_policy": "FIRST_AVAILABLE",
        "default_provider_type": {{ .Values.provider.type | quote }}
      },
      "storage": {
        {{- if eq .Values.storage.type "sqlite" }}
        "strategy": "sql",
        "sql_strategy": {
          "type": "sqlite",
          "name": "/app/data/database.db"
        }
        {{- else }}
        "strategy": "json",
        "json_strategy": {
          "storage_type": "single_file",
          "base_path": "/app/data"
        }
        {{- end }}
      },
      "ui": {
        "enabled": {{ ne .Values.ui.mode "disabled" }},
        "mode": {{ if eq .Values.ui.mode "embedded" }}"embedded"{{ else }}"split"{{ end }}
      },
      "logging": {
        "level": {{ .Values.server.logLevel | quote }}
      },
      "server": {
        "enabled": true,
        "host": {{ .Values.server.host | quote }},
        "port": {{ .Values.server.port }},
        "workers": {{ .Values.server.workers }},
        {{- /* Probes and in-cluster clients address the pod by IP or Service name; ingress hosts and extra names come from values. */}}
        {{- $fullname := include "orb.fullname" . }}
        {{- $hosts := list "localhost" "127.0.0.1" "::1" $fullname (printf "%s.%s" $fullname .Release.Namespace) (printf "%s.%s.svc" $fullname .Release.Namespace) (printf "%s.%s.svc.cluster.local" $fullname .Release.Namespace) }}
        {{- range .Values.ingress.hosts }}{{ $hosts = append $hosts .host }}{{ end }}
        {{- range .Values.server.trustedHosts }}{{ $hosts = append $hosts . }}{{ end }}
        "trusted_hosts": {{ $hosts | uniq | toJson }},
        "auth": {
          "enabled": {{ .Values.auth.enabled }},
          "strategy": {{ .Values.auth.strategy | quote }}
          {{- if eq .Values.auth.strategy "bearer_token" }},
          "bearer_token": {
            "secret_key": "${ORB_AUTH_BEARER_SECRET_KEY}"
          }
          {{- end }}
        }
      }
    }
