name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'dev-tools/docs/**'
      - 'src/**/cli/**'
      - 'README.md'
      - '*.md'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'dev-tools/docs/**'
      - 'src/**/cli/**'
      - 'README.md'
      - '*.md'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  # workflow_dispatch: allows triggering docs builds manually from the Actions UI
  workflow_dispatch:
  # NOTE: workflow_run trigger removed.  It fired after "Quality Checks" and
  # "Unit Tests" completed, causing docs to build twice on every main push
  # (once from push: and once from workflow_run:).  The push: trigger is
  # sufficient — it runs immediately and is path-scoped to docs-relevant files.

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

# Belt-and-suspenders: prevent any accidental implicit uv sync from firing
# the SPA build hook (setup.py build_ui.sh) in this workflow.
env:
  ORB_SKIP_UI_BUILD: "1"

jobs:
  config:
    name: Get Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      default-python-version: ${{ steps.config.outputs.default-python-version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Get project configuration
      id: config
      uses: ./.github/actions/get-config

  build:
    needs: [config]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # mike pushes versioned docs to gh-pages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python and UV
        uses: ./.github/actions/setup-uv-cached
        with:
          cache-key: deps-py3.12-docs-${{ hashFiles('.project.yml', 'pyproject.toml', 'uv.lock') }}
          group: docs
          fail-on-cache-miss: false

      - name: Build documentation
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Deploy dev alias via mike, export docs/site for Pages upload.
            bash dev-tools/docs/mike_deploy.sh dev --push
          else
            # PR path: strict build validation only — no versioning, no push.
            make ci-docs-build
          fi

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: docs/site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Smoke-check deployed site
        run: bash dev-tools/docs/smoke_check_pages.sh "${{ steps.deployment.outputs.page_url }}"
