name: Security Scanning

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'sdk/**/package.json'
      - 'sdk/**/package-lock.json'
      - 'sdk/**/go.mod'
      - 'sdk/**/go.sum'
      - 'sdk/**/pom.xml'
      - 'sdk/**/build.gradle'
      - 'sdk/**/build.gradle.kts'
      - 'sdk/**/*.csproj'
      - 'dev-tools/ci/check_runtime_licenses.py'
      - 'dev-tools/ci/ci_security_dispatcher.py'
      - '.trivyignore.yaml'
      - '.github/workflows/security-code.yml'
      - '.github/workflows/reusable-security.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'sdk/**/package.json'
      - 'sdk/**/package-lock.json'
      - 'sdk/**/go.mod'
      - 'sdk/**/go.sum'
      - 'sdk/**/pom.xml'
      - 'sdk/**/build.gradle'
      - 'sdk/**/build.gradle.kts'
      - 'sdk/**/*.csproj'
      - 'dev-tools/ci/check_runtime_licenses.py'
      - 'dev-tools/ci/ci_security_dispatcher.py'
      - '.trivyignore.yaml'
      - '.github/workflows/security-code.yml'
      - '.github/workflows/reusable-security.yml'
  schedule:
    - cron: '0 3 * * 0'

# Per-ref concurrency: a rapid series of pushes to the same branch only runs
# one security scan at a time; the newer push cancels the older.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Belt-and-suspenders: prevent any accidental implicit uv sync from firing
# the SPA build hook (setup.py build_ui.sh) in this workflow.
env:
  ORB_SKIP_UI_BUILD: "1"

permissions:
  contents: read

jobs:
  config:
    name: Configuration
    uses: ./.github/workflows/shared-config.yml

  security-bandit:
    name: Bandit (Security Scan)
    needs: [config]
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/reusable-security.yml
    with:
      scan-type: bandit
      default-python-version: ${{ needs.config.outputs.default-python-version }}
      python-version: ${{ needs.config.outputs.default-python-version }}

  security-safety:
    name: Safety (Dependency Scan)
    needs: [config]
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/reusable-security.yml
    with:
      scan-type: safety
      default-python-version: ${{ needs.config.outputs.default-python-version }}
      python-version: ${{ needs.config.outputs.default-python-version }}

  security-semgrep:
    name: Semgrep (Static Analysis)
    needs: config
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/reusable-security.yml
    with:
      scan-type: semgrep
      default-python-version: ${{ needs.config.outputs.default-python-version }}

  security-trivy-fs:
    name: Trivy (Filesystem Scan)
    needs: config
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/reusable-security.yml
    with:
      scan-type: trivy-fs
      default-python-version: ${{ needs.config.outputs.default-python-version }}

  security-trufflehog:
    name: TruffleHog (Secrets Scan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Check for secrets with TruffleHog
      uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85  # v3.97.9
      with:
        path: ./
        base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        extra_args: --debug --only-verified

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Dependency Review
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v4
      with:
        fail-on-severity: moderate
        # FINOS license categories (mirrors the ASF policy):
        # https://community.finos.org/docs/governance/software-projects/license-categories/
        # Category A (always allowed) + Category B (allowed as a package-managed
        # dependency) + MIT-0 (ASF Category A; needed because cffi, a runtime
        # dependency via cryptography, is MIT-0).
        allow-licenses: >-
          Apache-1.1, Apache-2.0, 0BSD, BSD-2-Clause, BSD-3-Clause, ISC, MIT,
          MS-PL, PHP-3.01, PostgreSQL, Python-2.0, PSF-2.0, Unlicense, X11,
          Zlib, zlib-acknowledgement, BSL-1.0, ICU, NCSA, ZPL-2.0, W3C, WTFPL,
          Unicode-DFS-2016, DOC, APAFML, Bitstream-Vera, OGL-UK-3.0, Xnet,
          MPL-1.0, MPL-1.1, MPL-2.0, EPL-1.0, CDDL-1.0, CDDL-1.1, CPL-1.0,
          IPL-1.0, ErlPL-1.1, OFL-1.1, Ruby, SPL-1.0, IPA, Ubuntu-font-1.0,
          CC0-1.0, MIT-0
        # The dependency-review action evaluates compound SPDX expressions
        # (e.g. 'MIT AND HPND-Markus-Kuhn') by requiring every component to be
        # allowlisted, and reports some packages as having "no detected license"
        # even though their actual PyPI METADATA license is permissive. Each
        # exemption below has been verified by reading the package's own
        # METADATA license / License-Expression directly:
        #   werkzeug              BSD-3-Clause AND LicenseRef-scancode-unknown-license-reference -> BSD-3-Clause (the LicenseRef is a scancode artifact, not a real second license)
        #   trufflehog (action)   AGPL-3.0 -> invoked as a GitHub Action step (CLI secret scanner), never imported or linked into orb-py; dev/CI tooling only
        #   rfc3987-syntax        Apache-2.0 AND GPL-1.0-or-later AND MIT -> MIT (METADATA: License-Expression: MIT)
        #   wcwidth               MIT AND HPND-Markus-Kuhn -> MIT (METADATA: License-Expression: MIT)
        #   lxml                  BSD-3-Clause AND GPL-1.0-or-later -> BSD-3-Clause (METADATA: License: BSD-3-Clause; GPL applies to a single legacy source file)
        #   protobuf              BSD-3-Clause AND LicenseRef-scancode-protobuf -> BSD-3-Clause (METADATA license text)
        #   cyclonedx-python-lib  no detected license -> Apache-2.0 (METADATA: License: Apache-2.0)
        #   fastapi               no detected license -> MIT (METADATA: License-Expression: MIT)
        #   aiohappyeyeballs      0BSD AND BSD-3-Clause AND GPL-1.0-or-later AND PSF-2.0 AND Python-2.0 -> PSF-2.0 (METADATA: License-Expression: PSF-2.0; permissive)
        #   aiohttp               no detected license -> Apache-2.0 (METADATA: License-Expression: Apache-2.0 AND MIT; dual permissive)
        #   docutils              BSD-2-Clause AND BSD-3-Clause AND CC-PDDC AND GPL-1.0-or-later AND GPL-3.0-only AND GPL-3.0-or-later AND ... -> public-domain + BSD-2-Clause (METADATA: License: public domain, Python, 2-Clause BSD; GPL applies to a few isolated source files in the docutils source tree)
        #   scramp                no detected license -> MIT-0 (METADATA: License-Expression: MIT No Attribution; permissive)
        #   semgrep               LGPL-2.0-only AND LGPL-2.1 -> LGPL-2.1 (PyPI classifier: LGPLv2; CLI-only scanner, not imported or linked into orb-py; LGPL permits this use)
        #   bowser (npm)          MIT AND MITNFA -> MIT-family permissive (TypeScript SDK transitive; MITNFA = MIT No False Attribution)
        #
        # Dev/CI-only tooling with a FINOS Category X license, or a license not
        # recognised by name above, that would otherwise fail when bumped. None
        # of these are shipped by the orb-py runtime install (`pip install
        # orb-py[...]`); the runtime license set is enforced separately by the
        # Runtime License Gate job below, scoped to `uv sync --extra all`.
        #   chardet         LGPL-2.1-or-later -> transitive via cyclonedx-bom (SBOM generation tooling)
        #   python-gitlab   LGPL-3.0-or-later -> transitive via python-semantic-release (release tooling)
        #   regex           Apache-2.0 AND CNRI-Python -> transitive via nltk / cfn-lint (lint and test tooling)
        allow-dependencies-licenses: 'pkg:pypi/werkzeug, pkg:githubactions/trufflesecurity/trufflehog, pkg:pypi/rfc3987-syntax, pkg:pypi/wcwidth, pkg:pypi/lxml, pkg:pypi/protobuf, pkg:pypi/cyclonedx-python-lib, pkg:pypi/fastapi, pkg:pypi/aiohappyeyeballs, pkg:pypi/aiohttp, pkg:pypi/docutils, pkg:pypi/scramp, pkg:pypi/semgrep, pkg:npm/bowser, pkg:pypi/chardet, pkg:pypi/python-gitlab, pkg:pypi/regex'
        # nltk GHSA-8mgp-746c-j5xp (affects <=3.10.3): CI-only, pulled in
        # transitively via safety; no upstream fix is published yet.
        allow-ghsas: GHSA-8mgp-746c-j5xp

  license-gate:
    name: Runtime License Gate
    needs: [config]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup UV with cache
      uses: ./.github/actions/setup-uv-cached
      with:
        cache-key: deps-py3.12-license-${{ hashFiles('.project.yml', 'pyproject.toml', 'uv.lock') }}
        extra: all
        fail-on-cache-miss: false

    # FINOS license categories: https://community.finos.org/docs/governance/software-projects/license-categories/
    # Checks only the runtime install (`uv sync --extra all`, no dependency-groups)
    # against Category A + B + MIT-0, with no per-package exemptions. Dev/CI-only
    # tooling is covered separately by the dependency-review purl exemptions
    # above, never by this gate. The allowlist is defined once in
    # dev-tools/ci/check_runtime_licenses.py and evaluated as a real SPDX
    # license expression (AND / OR / WITH / parens), not substring-matched,
    # so a compound expression like 'MIT AND GPL-3.0-or-later' can never
    # pass just because 'MIT' is an allowed substring. --with-system is
    # omitted from pip-licenses so its own tooling (itself, prettytable,
    # wcwidth, pip, setuptools, wheel) is never evaluated — those are the
    # scanner, not an orb-py runtime dependency.
    #
    # NOTE: the dependency-review `allow-licenses` input above cannot call
    # out to this script, so it must be kept in sync with the allowlist in
    # dev-tools/ci/check_runtime_licenses.py by hand.
    - name: Check Python runtime dependency licenses
      run: |
        set -o pipefail
        uv pip install pip-licenses==5.5.5
        uv run --no-sync pip-licenses --from=mixed --format=json \
          | python3 dev-tools/ci/check_runtime_licenses.py --ignore-package orb-py

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: sdk/typescript/package-lock.json

    - name: Install TypeScript SDK dependencies
      working-directory: sdk/typescript
      run: npm ci

    # Production dependency tree only (--production); dev tooling such as
    # jest/typescript is out of scope for a runtime license gate. Evaluated
    # by the same dev-tools/ci/check_runtime_licenses.py script and
    # allowlist as the Python leg above, so license-checker-rseidelsohn's
    # own --onlyAllow (which does substring matching, not real SPDX
    # expression evaluation) is not used.
    - name: Check TypeScript SDK runtime dependency licenses
      working-directory: sdk/typescript
      run: |
        set -o pipefail
        npx --yes license-checker-rseidelsohn@5.0.1 \
          --production \
          --excludePackages "@finos/open-resource-broker@0.1.0" \
          --json \
          | python3 ../../dev-tools/ci/check_runtime_licenses.py

  codeql-analysis:
    name: CodeQL Analysis
    needs: [config]
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || contains(github.event.head_commit.message, '[security]')
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/reusable-security.yml
    with:
      scan-type: codeql
      default-python-version: ${{ needs.config.outputs.default-python-version }}
      python-version: ${{ needs.config.outputs.default-python-version }}
