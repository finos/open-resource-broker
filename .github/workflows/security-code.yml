name: Security Scanning

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'sdk/**/package.json'
      - 'sdk/**/package-lock.json'
      - 'sdk/**/go.mod'
      - 'sdk/**/go.sum'
      - 'sdk/**/pom.xml'
      - 'sdk/**/build.gradle'
      - 'sdk/**/build.gradle.kts'
      - 'sdk/**/gradle.lockfile'
      - 'sdk/**/packages.lock.json'
      - 'sdk/**/*.csproj'
      - 'dev-tools/ci/check_runtime_licenses.py'
      - 'dev-tools/ci/ci_security_dispatcher.py'
      - '.trivyignore.yaml'
      - '.github/workflows/**'
      - '.github/requirements/**'
      - '.github/codeql/**'
      - '.github/actions/**'
      - '.project.yml'
      - 'Makefile'
      - 'makefiles/**'
      - 'tests/**'
      - 'dev-tools/**'
      - 'setup.py'
      - 'rxconfig.py'
      - 'hfmock.py'
      - 'deployment/**'
  # No paths filter on pull_request: several jobs in this workflow are
  # becoming required status checks, which must report (even if skipped) on
  # every PR including docs-only ones — a missing check blocks merge forever,
  # a skipped one does not. The `changes` job below detects whether the paths
  # that used to gate this trigger actually changed, and the heavy jobs skip
  # themselves accordingly instead of the workflow never running at all.
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 3 * * 0'

# Per-ref concurrency: a rapid series of pushes to the same branch only runs
# one security scan at a time; the newer push cancels the older. Pushes to
# main are never cancelled so every commit on main keeps its scan results.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Belt-and-suspenders: prevent any accidental implicit uv sync from firing
# the SPA build hook (setup.py build_ui.sh) in this workflow.
env:
  ORB_SKIP_UI_BUILD: "1"

permissions:
  contents: read

jobs:
  config:
    name: Configuration
    uses: ./.github/workflows/shared-config.yml

  # Reports which heavy jobs below are actually relevant to this PR, so a
  # docs-only or unrelated-module PR still gets a (skipped) report from every
  # job instead of no check at all. The job runs on every event so that jobs
  # depending on it are never skipped by a skipped dependency; on events other
  # than pull_request there is no diff to inspect, so it reports everything as
  # relevant and each job's own trigger gating (push paths filter, schedule)
  # decides whether it runs.
  changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      relevant: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.relevant }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Filter changed paths
      if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
      id: filter
      with:
        filters: |
          relevant:
            - 'src/**'
            - 'requirements*.txt'
            - 'pyproject.toml'
            - 'uv.lock'
            - 'sdk/**/package.json'
            - 'sdk/**/package-lock.json'
            - 'sdk/**/go.mod'
            - 'sdk/**/go.sum'
            - 'sdk/**/pom.xml'
            - 'sdk/**/build.gradle'
            - 'sdk/**/build.gradle.kts'
            - 'sdk/**/gradle.lockfile'
            - 'sdk/**/packages.lock.json'
            - 'sdk/**/*.csproj'
            - 'dev-tools/ci/check_runtime_licenses.py'
            - 'dev-tools/ci/ci_security_dispatcher.py'
            - '.trivyignore.yaml'
            - '.github/workflows/**'
            - '.github/requirements/**'
            - '.github/codeql/**'
            - '.github/actions/**'
            - '.project.yml'
            - 'Makefile'
            - 'makefiles/**'
            - 'tests/**'
            - 'dev-tools/**'
            - 'setup.py'
            - 'rxconfig.py'
            - 'hfmock.py'
            - 'deployment/**'

  security-pip-audit:
    name: pip-audit (Dependency Scan)
    needs: [config, changes]
    # Always expands so the required child check (`pip-audit (Dependency Scan) /
    # pip-audit Security Scan`) reports on every PR. `enabled` turns the scan
    # steps off only when the path filter proves nothing relevant changed, and
    # fails closed (scan runs) if the filter job itself did not succeed.
    if: ${{ !cancelled() && needs.config.result == 'success' }}
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/reusable-security.yml
    with:
      scan-type: pip-audit
      enabled: ${{ needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true' }}
      default-python-version: ${{ needs.config.outputs.default-python-version }}
      python-version: ${{ needs.config.outputs.default-python-version }}

  security-semgrep:
    name: Semgrep (Static Analysis)
    needs: [config, changes]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.relevant == 'true' && needs.config.result == 'success' }}
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/reusable-security.yml
    with:
      scan-type: semgrep
      default-python-version: ${{ needs.config.outputs.default-python-version }}

  security-trivy-fs:
    name: Trivy (Filesystem Scan)
    needs: [config, changes]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.relevant == 'true' && needs.config.result == 'success' }}
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/reusable-security.yml
    with:
      scan-type: trivy-fs
      default-python-version: ${{ needs.config.outputs.default-python-version }}

  security-trufflehog:
    name: TruffleHog (Secrets Scan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.result == 'success' && ((github.event_name == 'pull_request' && needs.changes.outputs.relevant == 'true') || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000') || github.event_name == 'schedule') }}

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Check for secrets with TruffleHog
      uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2  # v3.99.7
      with:
        path: ./
        # Scheduled runs have no before/after commits, so base and head resolve to
        # empty strings and the action scans the full history.
        base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        extra_args: --debug --only-verified

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.result == 'success' && github.event_name == 'pull_request' && needs.changes.outputs.relevant == 'true' }}
    # Job-level only: pull-requests: write lets the optional Dependabot step
    # below comment on or close a PR. No step in this job executes code from
    # the PR except the analysis script, which runs without a token.
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Dependency Review
      id: depreview
      continue-on-error: true
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v4
      with:
        fail-on-severity: moderate
        # FINOS license categories (mirrors the ASF policy):
        # https://community.finos.org/docs/governance/software-projects/license-categories/
        # Category A (always allowed) + Category B (allowed as a package-managed
        # dependency) + MIT-0 (ASF Category A; needed because cffi, a runtime
        # dependency via cryptography, is MIT-0).
        allow-licenses: >-
          Apache-1.1, Apache-2.0, 0BSD, BSD-2-Clause, BSD-3-Clause, ISC, MIT,
          MS-PL, PHP-3.01, PostgreSQL, Python-2.0, PSF-2.0, Unlicense, X11,
          Zlib, zlib-acknowledgement, BSL-1.0, ICU, NCSA, ZPL-2.0, W3C, WTFPL,
          Unicode-DFS-2016, DOC, APAFML, Bitstream-Vera, OGL-UK-3.0, Xnet,
          MPL-1.0, MPL-1.1, MPL-2.0, EPL-1.0, CDDL-1.0, CDDL-1.1, CPL-1.0,
          IPL-1.0, ErlPL-1.1, OFL-1.1, Ruby, SPL-1.0, IPA, Ubuntu-font-1.0,
          CC0-1.0, MIT-0
        # The dependency-review action evaluates compound SPDX expressions
        # (e.g. 'MIT AND HPND-Markus-Kuhn') by requiring every component to be
        # allowlisted, and reports some packages as having "no detected license"
        # even though their actual PyPI METADATA license is permissive. Each
        # exemption below has been verified by reading the package's own
        # METADATA license / License-Expression directly:
        #   werkzeug              BSD-3-Clause AND LicenseRef-scancode-unknown-license-reference -> BSD-3-Clause (the LicenseRef is a scancode artifact, not a real second license)
        #   trufflehog (action)   AGPL-3.0 -> invoked as a GitHub Action step (CLI secret scanner), never imported or linked into orb-py; dev/CI tooling only
        #   rfc3987-syntax        Apache-2.0 AND GPL-1.0-or-later AND MIT -> MIT (METADATA: License-Expression: MIT)
        #   wcwidth               MIT AND HPND-Markus-Kuhn -> MIT (METADATA: License-Expression: MIT)
        #   lxml                  BSD-3-Clause AND GPL-1.0-or-later -> BSD-3-Clause (METADATA: License: BSD-3-Clause; GPL applies to a single legacy source file)
        #   protobuf              BSD-3-Clause AND LicenseRef-scancode-protobuf -> BSD-3-Clause (METADATA license text)
        #   cyclonedx-python-lib  no detected license -> Apache-2.0 (METADATA: License: Apache-2.0)
        #   fastapi               no detected license -> MIT (METADATA: License-Expression: MIT)
        #   aiohappyeyeballs      0BSD AND BSD-3-Clause AND GPL-1.0-or-later AND PSF-2.0 AND Python-2.0 -> PSF-2.0 (METADATA: License-Expression: PSF-2.0; permissive)
        #   aiohttp               no detected license -> Apache-2.0 (METADATA: License-Expression: Apache-2.0 AND MIT; dual permissive)
        #   docutils              BSD-2-Clause AND BSD-3-Clause AND CC-PDDC AND GPL-1.0-or-later AND GPL-3.0-only AND GPL-3.0-or-later AND ... -> public-domain + BSD-2-Clause (METADATA: License: public domain, Python, 2-Clause BSD; GPL applies to a few isolated source files in the docutils source tree)
        #   scramp                no detected license -> MIT-0 (METADATA: License-Expression: MIT No Attribution; permissive)
        #   semgrep               LGPL-2.0-only AND LGPL-2.1 -> LGPL-2.1 (PyPI classifier: LGPLv2; CLI-only scanner, not imported or linked into orb-py; LGPL permits this use)
        #   bowser (npm)          MIT AND MITNFA -> MIT-family permissive (TypeScript SDK transitive; MITNFA = MIT No False Attribution)
        #   pillow                MIT-CMU -> MIT variant (METADATA: License-Expression: MIT-CMU; permissive. Used only by the standalone dev-tools/analysis/visualise script, not part of the orb-py runtime install)
        #   typing-extensions     Python-2.0 AND GPL-1.0-or-later AND ... AND 0BSD -> PSF-2.0 (METADATA: License-Expression: PSF-2.0; the reported expression is assembled from the licence texts bundled in the package files)
        #
        # Dev/CI-only tooling with a FINOS Category X license, or a license not
        # recognised by name above, that would otherwise fail when bumped. None
        # of these are shipped by the orb-py runtime install (`pip install
        # orb-py[...]`); the runtime license set is enforced separately by the
        # Runtime License Gate job below, scoped to `uv sync --extra all`.
        #   chardet         LGPL-2.1-or-later -> transitive via cyclonedx-bom (SBOM generation tooling)
        #   python-gitlab   LGPL-3.0-or-later -> transitive via python-semantic-release (release tooling)
        #   regex           Apache-2.0 AND CNRI-Python -> transitive via nltk / cfn-lint (lint and test tooling)
        #   grimp           BSD-2-Clause AND BSD-2-Clause-Views AND BSD-3-Clause -> transitive via import-linter (architecture-check tooling; METADATA: License: BSD 2-Clause License; the extra identifiers come from bundled Rust crates and are all permissive)
        allow-dependencies-licenses: 'pkg:pypi/werkzeug, pkg:githubactions/trufflesecurity/trufflehog, pkg:pypi/rfc3987-syntax, pkg:pypi/wcwidth, pkg:pypi/lxml, pkg:pypi/protobuf, pkg:pypi/cyclonedx-python-lib, pkg:pypi/fastapi, pkg:pypi/aiohappyeyeballs, pkg:pypi/aiohttp, pkg:pypi/docutils, pkg:pypi/scramp, pkg:pypi/semgrep, pkg:npm/bowser, pkg:pypi/chardet, pkg:pypi/python-gitlab, pkg:pypi/regex, pkg:pypi/pillow, pkg:pypi/grimp, pkg:pypi/typing-extensions'
        # Filelock advisories with no fix for Python 3.10: every fixed release
        # requires Python >= 3.11, while orb-py still supports 3.10. filelock is
        # not a runtime dependency; it is present only in dev and test tooling
        # on Python 3.10, where it resolves to the affected 4.1.0. Same
        # exception as the filelock entries in .trivyignore.yaml. Review by
        # 2027-01-27 or when Python 3.10 support ends.
        allow-ghsas: >-
          GHSA-v4x8-3wr5-3wq8, GHSA-jqc4-5cvw-7w85, GHSA-crv4-6mhj-j5jh,
          GHSA-2g95-wg33-c5x2, GHSA-567q-5qvw-pf92, GHSA-9vhv-jxww-xfm5,
          GHSA-6627-m3xw-93mp, GHSA-69hj-f68j-2879, GHSA-8mx5-7m5m-r77g,
          GHSA-9c4x-gm8v-wgc4, GHSA-cwqr-hh33-gh44, GHSA-fj95-fr6c-h845,
          GHSA-fq56-3cx3-fjxp, GHSA-m462-7rxw-wvpg, GHSA-rfpc-qcw5-3pc4,
          GHSA-9j6q-wvj5-jgjg, GHSA-wfhq-q4j2-c37m

    # Dependabot PRs that add a vulnerable version.
    #
    # The analysis step has no token and never calls the GitHub API: it turns
    # the action outputs into a decision plus pre-rendered comment text and
    # reports the effective mode and gate results in the job summary. The
    # acting step below holds the token and only posts or closes from those
    # files.
    #
    # Repository variable DEPENDABOT_AUTOCLOSE (default dry when unset):
    #   dry      summary only
    #   comment  comment on the PR (one comment, edited in place)
    #   close    comment, and close single-dependency PRs that add a new
    #            vulnerability and fix none
    # Runs triggered by Dependabot may not be able to read repository
    # variables; the summary states whether the variable was seen.
    - name: Analyse Dependency Review result
      id: analyse
      if: ${{ always() && steps.depreview.outcome == 'failure' }}
      continue-on-error: true
      env:
        VULN: ${{ steps.depreview.outputs.vulnerable-changes }}
        CHANGES: ${{ steps.depreview.outputs.dependency-changes }}
        MODE_RAW: ${{ vars.DEPENDABOT_AUTOCLOSE }}
        GATE_AUTHOR: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        GATE_ACTOR: ${{ github.actor_id == '49699333' }}
        GATE_TRIGGERING_ACTOR: ${{ github.triggering_actor == 'dependabot[bot]' }}
        GATE_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        GATE_HEAD_REF: ${{ startsWith(github.event.pull_request.head.ref, 'dependabot/') }}
        GATE_NO_KEEP_OPEN: ${{ !contains(github.event.pull_request.labels.*.name, 'keep-open') }}
      run: |
        out="$RUNNER_TEMP/orb-depreview"
        bash .github/scripts/depreview-decision.sh "$out" >> "$GITHUB_STEP_SUMMARY"

    # The actor check is an additional restriction on top of the PR author
    # check (a human re-run or rebase changes the actor and disables the
    # step); it is not what authorises the action.
    - name: Comment on or close Dependabot PR
      if: >-  # zizmor: ignore[bot-conditions]
        ${{ always()
        && steps.depreview.outcome == 'failure'
        && steps.analyse.outcome == 'success'
        && (vars.DEPENDABOT_AUTOCLOSE == 'comment' || vars.DEPENDABOT_AUTOCLOSE == 'close')
        && github.event.pull_request.user.login == 'dependabot[bot]'
        && github.actor_id == '49699333'
        && github.triggering_actor == 'dependabot[bot]'
        && github.event.pull_request.head.repo.full_name == github.repository
        && startsWith(github.event.pull_request.head.ref, 'dependabot/')
        && !contains(github.event.pull_request.labels.*.name, 'keep-open') }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        MODE: ${{ vars.DEPENDABOT_AUTOCLOSE }}
        SECURITY_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'security') }}
      run: |
        dir="$RUNNER_TEMP/orb-depreview"
        decision=$(cat "$dir/decision")
        [ "$decision" = none ] && exit 0

        # Close only in close mode, for a close decision, and never for a
        # security-labelled PR; otherwise comment only.
        body="$dir/comment.md"
        if [ "$MODE" = close ] && [ "$decision" = close ] && [ "$SECURITY_LABEL" != true ]; then
          body="$dir/close.md"
        fi

        # One comment per PR: edit the bot's existing marked comment in place.
        id=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
          --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- orb-depreview -->")))][0].id // empty' \
          | head -n 1)
        if [ -n "$id" ]; then
          existing=$(gh api "repos/$GH_REPO/issues/comments/$id" --jq .body)
          if [ "$existing" != "$(cat "$body")" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F "body=@$body" > /dev/null
          fi
        else
          gh pr comment "$PR_NUMBER" --body-file "$body"
        fi

        if [ "$body" = "$dir/close.md" ]; then
          gh pr close "$PR_NUMBER"
        fi

    # Keep the required check red whenever Dependency Review failed, including
    # when the analysis or acting step above errored.
    - name: Fail when Dependency Review failed
      if: ${{ always() && steps.depreview.outcome == 'failure' }}
      run: exit 1

  license-gate:
    name: Runtime License Gate
    needs: [config, changes]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.relevant == 'true' && needs.config.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup UV with cache
      uses: ./.github/actions/setup-uv-cached
      with:
        cache-key: deps-py3.12-license-${{ hashFiles('.project.yml', 'pyproject.toml', 'uv.lock') }}
        extra: all
        fail-on-cache-miss: false

    # FINOS license categories: https://community.finos.org/docs/governance/software-projects/license-categories/
    # Checks only the runtime install (`uv sync --extra all`, no dependency-groups)
    # against Category A + B + MIT-0, with no per-package exemptions. Dev/CI-only
    # tooling is covered separately by the dependency-review purl exemptions
    # above, never by this gate. The allowlist is defined once in
    # dev-tools/ci/check_runtime_licenses.py and evaluated as a real SPDX
    # license expression (AND / OR / WITH / parens), not substring-matched,
    # so a compound expression like 'MIT AND GPL-3.0-or-later' can never
    # pass just because 'MIT' is an allowed substring. --with-system is
    # omitted from pip-licenses so its own tooling (itself, prettytable,
    # wcwidth, pip, setuptools, wheel) is never evaluated — those are the
    # scanner, not an orb-py runtime dependency.
    #
    # NOTE: the dependency-review `allow-licenses` input above cannot call
    # out to this script, so it must be kept in sync with the allowlist in
    # dev-tools/ci/check_runtime_licenses.py by hand.
    - name: Check Python runtime dependency licenses
      run: |
        set -o pipefail
        uv pip install --no-config --require-hashes --no-deps -r .github/requirements/pip-licenses.txt
        uv run --no-sync pip-licenses --from=mixed --format=json \
          | python3 dev-tools/ci/check_runtime_licenses.py --ignore-package orb-py

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: sdk/typescript/package-lock.json

    - name: Install TypeScript SDK dependencies
      working-directory: sdk/typescript
      run: npm ci

    # Production dependency tree only (--production); dev tooling such as
    # jest/typescript is out of scope for a runtime license gate. Evaluated
    # by the same dev-tools/ci/check_runtime_licenses.py script and
    # allowlist as the Python leg above, so license-checker-rseidelsohn's
    # own --onlyAllow (which does substring matching, not real SPDX
    # expression evaluation) is not used.
    - name: Check TypeScript SDK runtime dependency licenses
      working-directory: sdk/typescript
      run: |
        set -o pipefail
        npx --yes license-checker-rseidelsohn@5.0.1 \
          --production \
          --excludePackages "@finos/open-resource-broker@0.1.0" \
          --json \
          | python3 ../../dev-tools/ci/check_runtime_licenses.py

  codeql-analysis:
    name: CodeQL Analysis
    needs: [config, changes]
    # Always expands so the required child checks (`CodeQL Analysis / codeql
    # Security Scan (python|actions)`) report on every PR; `enabled` decides
    # whether the analysis steps run. Direct pushes to main are also scanned so
    # a fix merged outside a PR closes its own alerts on the next scan, instead
    # of waiting for the weekly schedule. Fails closed if the filter job failed.
    if: ${{ !cancelled() && needs.config.result == 'success' }}
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/reusable-security.yml
    with:
      scan-type: codeql
      enabled: ${{ (github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true')) || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || contains(github.event.head_commit.message, '[security]') }}
      default-python-version: ${{ needs.config.outputs.default-python-version }}
      python-version: ${{ needs.config.outputs.default-python-version }}
