name: Workflow Validation

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'Makefile'
      - 'makefiles/**'
  # No paths filter on pull_request: Validate Workflow Files is becoming a
  # required status check, so it must report (even if there's nothing of
  # its own concern to check) on every PR, including docs-only ones. The
  # job itself is cheap, so no job-level change detection is needed here.
  pull_request: {}

permissions:
  contents: read

jobs:
  config:
    name: Get Configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      default-python-version: ${{ steps.config.outputs.default-python-version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Get project configuration
      id: config
      uses: ./.github/actions/get-config

  validate-workflows:
    name: Validate Workflow Files
    runs-on: ubuntu-latest
    needs: [config]
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup Python and UV
      uses: ./.github/actions/setup-uv-cached
      with:
        cache-key: deps-py3.12-lint-${{ hashFiles('.project.yml', 'pyproject.toml', 'uv.lock') }}
        group: lint
        fail-on-cache-miss: false

    - name: Validate workflow syntax and logic
      run: |
        make validate-workflow-syntax

    - name: Validate workflows with actionlint
      run: |
        echo "::add-matcher::.github/actionlint-matcher.json"
        pip install actionlint-py
        actionlint .github/workflows/*.yml
      shell: bash

    - name: Validate GitHub Actions SHA consistency
      # Fails if the same action@version comment is pinned to two different
      # SHAs across workflows (a divergent/invalid pin is release-breaking).
      run: python3 dev-tools/quality/validate_action_sha_consistency.py
      shell: bash

    - name: Validate shell scripts with shellcheck
      uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
      with:
        ignore_paths: '.venv .git __pycache__ node_modules'
