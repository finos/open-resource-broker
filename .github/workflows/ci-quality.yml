name: Quality Checks

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'uv.lock'
      - '.ruff.toml'
      - '.github/workflows/ci-quality.yml'
  # No paths filter on pull_request: these checks act as the merge gate, so
  # they run on every PR (including docs-only changes). push keeps its paths filter.
  pull_request:
    branches: [ main, develop ]
  # workflow_dispatch: allows re-running quality checks manually from the Actions UI
  workflow_dispatch:

# Cancel in-progress runs when a new push arrives on the same branch/ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Belt-and-suspenders: prevent any accidental implicit uv sync from firing
# the SPA build hook (setup.py build_ui.sh) in this workflow.
env:
  ORB_SKIP_UI_BUILD: "1"

jobs:
  config:
    name: Configuration
    uses: ./.github/workflows/shared-config.yml

  auto-format-suggest:
    name: Auto-Format Suggestions
    # Post formatted changes as PR review suggestions to apply via the GitHub
    # UI's "Commit suggestion" button. Suggestions can only target lines that
    # are part of the PR diff; anything else is caught by the required
    # "Ruff (Code Quality)" check, which tells the author to run
    # `make format-fix`.
    # Runs under plain pull_request (not pull_request_target) - reviewdog
    # action-suggester posts review comments via the GITHUB_TOKEN scoped to
    # pull-requests: write. pull_request_target is deliberately avoided: it
    # would execute fork code with a write token (pwn-request risk).
    # Dependabot PRs are skipped: its token is read-only and its changes are
    # machine-generated.
    if: >-
      github.event_name == 'pull_request'
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [config]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup UV with cache
        uses: ./.github/actions/setup-uv-cached
        with:
          cache-key: deps-py3.12-lint-${{ hashFiles('.project.yml', 'pyproject.toml', 'uv.lock') }}
          group: lint
          fail-on-cache-miss: false

      - name: Run formatter
        run: make format-fix

      - name: Post review suggestions
        uses: reviewdog/action-suggester@ac5ce6d94e35c00530447dc63c271e38e4fd36c6  # v1.26.3
        with:
          tool_name: ruff
          level: warning
          fail_level: none

  lint-ruff:
    name: Ruff (Code Quality)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [config]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup UV with cache
        uses: ./.github/actions/setup-uv-cached
        with:
          cache-key: deps-py3.12-lint-${{ hashFiles('.project.yml', 'pyproject.toml', 'uv.lock') }}
          group: lint
          fail-on-cache-miss: false

      - name: Check code quality
        run: make ci-quality-ruff

  lint-ruff-optional:
    name: Ruff (Extended Checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [config, lint-ruff]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup UV with cache
        uses: ./.github/actions/setup-uv-cached
        with:
          cache-key: deps-py3.12-lint-${{ hashFiles('.project.yml', 'pyproject.toml', 'uv.lock') }}
          group: lint
          fail-on-cache-miss: false

      - name: Extended linting (warnings)
        run: make ci-quality-ruff-optional
        continue-on-error: true

  lint-pyright:
    name: Type Checking (pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [config, lint-ruff]
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup UV with cache
      uses: ./.github/actions/setup-uv-cached
      with:
        cache-key: deps-py3.12-typecheck-${{ hashFiles('.project.yml', 'pyproject.toml', 'uv.lock') }}
        group: typecheck
        fail-on-cache-miss: false

    - name: Run pyright type check
      run: make ci-quality-pyright


  arch-validation:
    name: Architecture Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [config, lint-ruff]
    permissions:
      contents: read
    strategy:
      matrix:
        check: [cqrs, clean, imports, lint-imports, file-sizes]
        include:
          - check: cqrs
            description: "CQRS Pattern Validation"
          - check: clean
            description: "Clean Architecture Dependencies"
          - check: imports
            description: "Import Validation"
          - check: lint-imports
            description: "Import-Linter Layer Contracts"
          - check: file-sizes
            description: "File Size Compliance"
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup UV with cache
      uses: ./.github/actions/setup-uv-cached
      with:
        cache-key: deps-py3.12-arch-${{ hashFiles('.project.yml', 'pyproject.toml', 'uv.lock') }}
        group: arch
        fail-on-cache-miss: false

    - name: Run architecture validation (${{ matrix.description }})
      run: make ci-arch-${{ matrix.check }}

  python-version-drift:
    name: Python Version Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs independently of lint to give early signal on version drift.
    # pyyaml is available via the project's core [dependencies] so any
    # group that installs the project also provides it.  Use the arch
    # group (smallest group that triggers a uv sync with the project).
    needs: [config]
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Setup UV with cache
      uses: ./.github/actions/setup-uv-cached
      with:
        cache-key: deps-py3.12-arch-${{ hashFiles('.project.yml', 'pyproject.toml', 'uv.lock') }}
        group: arch
        fail-on-cache-miss: false

    - name: Check Python version drift
      run: make ci-check-python-version-drift
