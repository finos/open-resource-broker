name: Changelog Validation

on:
  pull_request:
    paths: 
      - 'CHANGELOG.md'
      - '.git-changelog.toml'
      - '.changelog-template.md'
      - 'dev-tools/release/changelog_manager.py'
      - '.github/workflows/changelog-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    name: Get Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      default-python-version: ${{ steps.config.outputs.default-python-version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Get project configuration
      id: config
      uses: ./.github/actions/get-config

  validate-changelog:
    name: Validate Changelog Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [config]
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # Need full history for changelog generation
    
    - name: Setup Python and UV
      uses: ./.github/actions/setup-uv-cached
      with:
        cache-key: deps-py3.12-build-${{ hashFiles('.project.yml', 'pyproject.toml', 'uv.lock') }}
        group: build
        fail-on-cache-miss: false
    
    - name: Install changelog dependencies
      run: |
        uv pip install --no-config --require-hashes --no-deps -r .github/requirements/changelog-tools.txt
    
    - name: Validate changelog format
      run: |
        make changelog-validate

    - name: Preview changelog changes
      if: github.event_name == 'pull_request'
      run: |
        {
          echo "## Changelog Preview"
          echo ""
          echo "Changes that would be added to changelog:"
          echo ""
          echo '```markdown'
        } >> "$GITHUB_STEP_SUMMARY"
        make changelog-preview FROM_COMMIT="${{ github.event.pull_request.base.sha }}" >> "$GITHUB_STEP_SUMMARY" || echo "No changes to preview" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
