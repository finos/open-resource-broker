name: Reusable Security Workflow

on:
  workflow_call:
    inputs:
      scan-type:
        description: 'Type of security scan (pip-audit, semgrep, trivy-fs, hadolint, codeql)'
        required: true
        type: string
      python-version:
        description: 'Python version for scans that need it'
        required: false
        type: string
      default-python-version:
        description: 'Default Python version (fallback)'
        required: true
        type: string
      cache-key:
        description: >-
          Optional explicit cache key.  When provided the job restores (and, on
          a miss, repopulates) the environment under this key.  When omitted the
          job derives its own group-keyed key from the lockfile hash — the first
          run installs and saves it, later runs hit warm.
        required: false
        type: string
        default: ''
      enabled:
        description: >-
          When false every step is skipped, so the job still reports success
          under its own name without scanning.  Callers set this to false only
          when no scanned path changed.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  security-scan:
    name: ${{ inputs.scan-type }} Security Scan
    if: inputs.scan-type != 'codeql'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        if: inputs.enabled
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python and UV
        if: inputs.scan-type == 'pip-audit' && inputs.enabled
        uses: ./.github/actions/setup-uv-cached
        with:
          # Use the caller-supplied cache key when set; otherwise derive the
          # canonical security-group key from the lockfile hash.  setup-uv-cached
          # restores on hit and saves on a miss, so the cache self-warms.
          cache-key: >-
            ${{
              inputs.cache-key != ''
              && inputs.cache-key
              || format('deps-py3.12-security-{0}',
                   hashFiles('.project.yml', 'pyproject.toml', 'uv.lock'))
            }}
          group: security
          fail-on-cache-miss: false

      # pip-audit Dependency Scan
      - name: Run pip-audit dependency scan
        if: inputs.scan-type == 'pip-audit' && inputs.enabled
        run: make ci-security-pip-audit

      # Semgrep Static Analysis
      # Semgrep is a uv project (dev-tools/ci/semgrep) so Dependabot can update
      # its lock with the overrides kept. uv comes from the hash-locked tool
      # requirements and installs into the setup-python interpreter only
      # (UV_PYTHON_DOWNLOADS=never), into a venv outside the workspace so the scan
      # does not read it. --locked fails if pyproject.toml and uv.lock disagree.
      - name: Setup Python for Semgrep
        id: semgrep-python
        if: inputs.scan-type == 'semgrep' && inputs.enabled
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ inputs.default-python-version }}

      - name: Install Semgrep
        if: inputs.scan-type == 'semgrep' && inputs.enabled
        env:
          PYTHON: ${{ steps.semgrep-python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/semgrep-venv
        run: |
          pip install --require-hashes --no-deps -r .github/requirements/uv.txt
          uv sync --locked --project dev-tools/ci/semgrep --python "$PYTHON"
          echo "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"

      # --error makes semgrep exit non-zero on any finding, which fails the job.
      # Findings are also written to semgrep.sarif and surfaced in the GitHub
      # Security tab by the upload step that follows.
      - name: Run Semgrep security analysis
        if: inputs.scan-type == 'semgrep' && inputs.enabled
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/python \
            --sarif \
            --output semgrep.sarif \
            --error \
            .

      # Canary for a Semgrep upgrade. When a pull request changes the Semgrep
      # project, scan the same tree with the Semgrep locked on the base commit and
      # fail if the new one reports fewer results (rules or ignore handling
      # silently broken). Skipped when the base commit has no Semgrep project.
      # The current scan's output is excluded so both scans see the same tree.
      - name: Compare Semgrep results with the base commit
        if: >-
          inputs.scan-type == 'semgrep' && inputs.enabled
          && github.event_name == 'pull_request' && always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTHON: ${{ steps.semgrep-python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        run: |
          project=dev-tools/ci/semgrep
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- "$project"; then
            echo "Semgrep project unchanged; no baseline comparison needed."
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA:$project/uv.lock" 2>/dev/null; then
            echo "Base commit has no Semgrep project; no baseline to compare."
            exit 0
          fi
          base="$(mktemp -d "$RUNNER_TEMP/semgrep-base.XXXXXX")"
          git show "$BASE_SHA:$project/pyproject.toml" > "$base/pyproject.toml"
          git show "$BASE_SHA:$project/uv.lock" > "$base/uv.lock"
          UV_PROJECT_ENVIRONMENT="$base/venv" uv sync --locked --project "$base" --python "$PYTHON"
          "$base/venv/bin/semgrep" scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/python \
            --exclude semgrep.sarif \
            --sarif \
            --output "$RUNNER_TEMP/semgrep-baseline.sarif" \
            .
          python3 dev-tools/ci/semgrep_baseline_check.py "$RUNNER_TEMP/semgrep-baseline.sarif" semgrep.sarif

      # Semgrep still writes results silenced by `# nosemgrep` into the SARIF,
      # and code scanning would keep them open. Drop them before upload. When
      # Semgrep produced no SARIF there is no filtered file and the upload
      # fails, instead of uploading an empty run that would close every alert.
      - name: Drop suppressed Semgrep results
        if: inputs.scan-type == 'semgrep' && inputs.enabled && always()
        run: |
          if [ -f semgrep.sarif ]; then
            python3 dev-tools/ci/filter_sarif_suppressions.py semgrep.sarif semgrep-filtered.sarif
          fi

      - name: Upload Semgrep SARIF results
        if: inputs.scan-type == 'semgrep' && inputs.enabled && always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: semgrep-filtered.sarif

      # Trivy Filesystem Scan
      # Trivy reports CRITICAL and HIGH findings (severity plus
      # limit-severities-for-sarif) and exits non-zero when any are present, which
      # fails the job.  Results are also surfaced in the GitHub Security tab via
      # the upload-sarif step below.
      - name: Run Trivy filesystem vulnerability scanner
        if: inputs.scan-type == 'trivy-fs' && inputs.enabled
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml

      - name: Upload Trivy filesystem scan results
        if: inputs.scan-type == 'trivy-fs' && inputs.enabled && always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: 'trivy-fs-results.sarif'

      # Hadolint Dockerfile Scan
      # Hadolint exits non-zero on findings at or above its default failure
      # threshold, which fails the job.  Findings are also written to
      # hadolint-results.sarif and uploaded to the GitHub Security tab below.
      - name: Run Hadolint Dockerfile scan
        if: inputs.scan-type == 'hadolint' && inputs.enabled
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: false

      - name: Upload Hadolint SARIF results
        if: inputs.scan-type == 'hadolint' && inputs.enabled && always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: hadolint-results.sarif

  # CodeQL runs once per language so each analysis uploads under a stable
  # `/language:<lang>` category and keeps matching existing alerts.
  #
  # Known coverage gap:
  # - dependency-review only runs on pull_request events, so direct pushes to
  #   main bypass it; branch protection is expected to prevent those.
  codeql:
    name: ${{ inputs.scan-type }} Security Scan (${{ matrix.language }})
    if: inputs.scan-type == 'codeql'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]

    steps:
      - name: Checkout code
        if: inputs.enabled
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python and UV
        if: matrix.language == 'python' && inputs.enabled
        uses: ./.github/actions/setup-uv-cached
        with:
          cache-key: >-
            ${{
              inputs.cache-key != ''
              && inputs.cache-key
              || format('deps-py3.12-security-{0}',
                   hashFiles('.project.yml', 'pyproject.toml', 'uv.lock'))
            }}
          group: security
          fail-on-cache-miss: false

      # A configuration or query-suite error fails the job rather than falling
      # back to a narrower scan.
      - name: Initialize CodeQL
        if: inputs.enabled
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        if: inputs.enabled
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
