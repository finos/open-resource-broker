name: Reusable Security Workflow

on:
  workflow_call:
    inputs:
      scan-type:
        description: 'Type of security scan (pip-audit, semgrep, trivy-fs, hadolint, codeql)'
        required: true
        type: string
      python-version:
        description: 'Python version for scans that need it'
        required: false
        type: string
      default-python-version:
        description: 'Default Python version (fallback)'
        required: true
        type: string
      cache-key:
        description: >-
          Optional explicit cache key.  When provided the job restores (and, on
          a miss, repopulates) the environment under this key.  When omitted the
          job derives its own group-keyed key from the lockfile hash — the first
          run installs and saves it, later runs hit warm.
        required: false
        type: string
        default: ''
      enabled:
        description: >-
          When false every step is skipped, so the job still reports success
          under its own name without scanning.  Callers set this to false only
          when no scanned path changed.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  security-scan:
    name: ${{ inputs.scan-type }} Security Scan
    if: inputs.scan-type != 'codeql'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        if: inputs.enabled
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python and UV
        if: inputs.scan-type == 'pip-audit' && inputs.enabled
        uses: ./.github/actions/setup-uv-cached
        with:
          # Use the caller-supplied cache key when set; otherwise derive the
          # canonical security-group key from the lockfile hash.  setup-uv-cached
          # restores on hit and saves on a miss, so the cache self-warms.
          cache-key: >-
            ${{
              inputs.cache-key != ''
              && inputs.cache-key
              || format('deps-py3.12-security-{0}',
                   hashFiles('.project.yml', 'pyproject.toml', 'uv.lock'))
            }}
          group: security
          fail-on-cache-miss: false

      # pip-audit Dependency Scan
      - name: Run pip-audit dependency scan
        if: inputs.scan-type == 'pip-audit' && inputs.enabled
        run: make ci-security-pip-audit

      # Semgrep Static Analysis
      - name: Install Semgrep
        if: inputs.scan-type == 'semgrep' && inputs.enabled
        run: pip install --require-hashes --no-deps -r .github/requirements/semgrep.txt

      # || true on the semgrep command below is INTENTIONAL: semgrep is advisory-only
      # for now.  --error requests a non-zero exit on findings, but || true absorbs it
      # so CI is never blocked.  Findings are still captured in semgrep.sarif and
      # surfaced in the GitHub Security tab via the upload-sarif step that follows.
      # TODO: remove || true once the finding backlog is triaged and semgrep is
      # promoted to a hard gate.
      - name: Run Semgrep security analysis
        if: inputs.scan-type == 'semgrep' && inputs.enabled
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/python \
            --sarif \
            --output semgrep.sarif \
            --error \
            . || true

      - name: Upload Semgrep SARIF results
        if: inputs.scan-type == 'semgrep' && inputs.enabled && always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: semgrep.sarif

      # Trivy Filesystem Scan
      # Trivy emits SARIF limited to CRITICAL and HIGH findings (severity plus
      # limit-severities-for-sarif) and sets no exit-code input, so it never fails
      # the step regardless of findings.  This is INTENTIONAL: results are surfaced
      # in the GitHub Security tab via the upload-sarif step below, but do not block
      # CI.  Making Trivy a hard gate would need an explicit exit-code input.
      - name: Run Trivy filesystem vulnerability scanner
        if: inputs.scan-type == 'trivy-fs' && inputs.enabled
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          trivyignores: .trivyignore.yaml

      - name: Upload Trivy filesystem scan results
        if: inputs.scan-type == 'trivy-fs' && inputs.enabled && always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: 'trivy-fs-results.sarif'

      # Hadolint Dockerfile Scan
      # no-fail: true is INTENTIONAL: hadolint is advisory-only for now.  Findings
      # are written to hadolint-results.sarif and uploaded to the GitHub Security tab
      # via the upload-sarif step below, but a non-zero hadolint exit code does not
      # block CI.
      # TODO: remove no-fail: true once Dockerfile best-practice rules have been
      # reviewed and hadolint is ready to act as a hard gate.
      - name: Run Hadolint Dockerfile scan
        if: inputs.scan-type == 'hadolint' && inputs.enabled
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: true

      - name: Upload Hadolint SARIF results
        if: inputs.scan-type == 'hadolint' && inputs.enabled && always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: hadolint-results.sarif

  # CodeQL runs once per language so each analysis uploads under a stable
  # `/language:<lang>` category and keeps matching existing alerts.
  #
  # Known coverage gaps:
  # - TruffleHog (secret scanning) skips scheduled runs; it only runs on push/PR.
  # - dependency-review only runs on pull_request events, so direct pushes to
  #   main bypass it; branch protection is expected to prevent those.
  codeql:
    name: ${{ inputs.scan-type }} Security Scan (${{ matrix.language }})
    if: inputs.scan-type == 'codeql'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]

    steps:
      - name: Checkout code
        if: inputs.enabled
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python and UV
        if: matrix.language == 'python' && inputs.enabled
        uses: ./.github/actions/setup-uv-cached
        with:
          cache-key: >-
            ${{
              inputs.cache-key != ''
              && inputs.cache-key
              || format('deps-py3.12-security-{0}',
                   hashFiles('.project.yml', 'pyproject.toml', 'uv.lock'))
            }}
          group: security
          fail-on-cache-miss: false

      # A configuration or query-suite error fails the job rather than falling
      # back to a narrower scan.
      - name: Initialize CodeQL
        if: inputs.enabled
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        if: inputs.enabled
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
