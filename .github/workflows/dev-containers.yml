# Container Build
#
# Images are published only for commits whose Unit Tests push run succeeded:
# the tests-gate job polls ci-tests.yml for the pushed commit and fails closed
# unless it finished green. Pull requests build and scan a single-platform
# image with read-only permissions and never push or write the build cache.
#
# workflow_dispatch is maintainer-only. On main it is gated and may publish,
# but only if ci-tests.yml ran successfully on a push of that exact commit; a
# commit with no such run fails the gate. On any other branch it is a
# build-only dry run.
name: Container Build

env:
  CONTAINER_TRIGGERS: "/container"

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Dockerfile*'
      - 'src/**'
      - 'pyproject.toml'
      - 'deployment/docker/**'
      - 'dev-tools/container/container_build.sh'
      - 'dev-tools/package/**'
      - 'makefiles/deploy.mk'
      - 'makefiles/dev.mk'
      - 'Makefile'
      - 'setup.py'
      - '.github/workflows/dev-containers.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Dockerfile*'
      - 'src/**'
      - 'pyproject.toml'
      - 'deployment/docker/**'
      - 'dev-tools/container/container_build.sh'
      - 'dev-tools/package/**'
      - 'makefiles/deploy.mk'
      - 'makefiles/dev.mk'
      - 'Makefile'
      - 'setup.py'
      - '.github/workflows/dev-containers.yml'
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images to registry'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  # Scope per ref so runs on different branches/PRs do not cancel each other.
  # Without the ref suffix any container run repo-wide would cancel this one,
  # causing PR jobs to show CANCELLED (the red-X on PR #292).
  group: container-registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Publishing is allowed only for a commit whose Unit Tests push run passed.
  # The poll step is skipped on pull requests (no image is published there), so
  # this job is green and plain `needs` is enough for downstream jobs. A manual
  # dispatch on main uses the same check: it looks up the push run of ci-tests.yml
  # for the dispatched commit and fails closed when there is none.
  tests-gate:
    name: Wait for Unit Tests
    runs-on: ubuntu-latest
    # Poll budget below is at most 150 x 30s = 75 min.
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
    - name: Wait for Unit Tests on this commit
      if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      env:
        GH_TOKEN: ${{ github.token }}
        MAX_POLLS: "150"
        POLL_INTERVAL: "30"
        # A push run can take a moment to appear after the push event.
        MAX_MISSING_POLLS: "10"
      run: |
        missing=0
        for ((i = 1; i <= MAX_POLLS; i++)); do
          if ! run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci-tests.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100" \
              --jq '.workflow_runs | sort_by(.created_at) | last // empty | "\(.status) \(.conclusion // "none") \(.html_url)"'); then
            echo "API call failed (poll $i/$MAX_POLLS), retrying"
            sleep "$POLL_INTERVAL"
            continue
          fi
          if [[ -z "$run" ]]; then
            missing=$((missing + 1))
            if (( missing >= MAX_MISSING_POLLS )); then
              echo "::error::no ci-tests run found for sha ${GITHUB_SHA}"
              exit 1
            fi
            echo "No ci-tests run found yet (attempt $missing/$MAX_MISSING_POLLS)"
          else
            read -r status conclusion url <<< "$run"
            echo "ci-tests run $url: status=$status conclusion=$conclusion"
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then
                exit 0
              fi
              echo "::error::ci-tests completed with conclusion $conclusion; not publishing"
              exit 1
            fi
          fi
          sleep "$POLL_INTERVAL"
        done
        echo "::error::timed out waiting for ci-tests on ${GITHUB_SHA}"
        exit 1

  config:
    name: Configuration
    uses: ./.github/workflows/shared-config.yml

  calculate-tags:
    name: Calculate Container Tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [config, tests-gate]
    permissions:
      contents: read
    outputs:
      primary-tags: ${{ steps.tags.outputs.primary-tags }}
      python-tags: ${{ steps.tags.outputs.python-tags }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Calculate container tags
      id: tags
      env:
        IS_RELEASE: ${{ needs.config.outputs.is-release }}
      run: |
        make get-container-tags >> "$GITHUB_OUTPUT"

  # Build the wheel once and share it across every Python version in the
  # build and publish job matrices below. The wheel is pure-Python, so it is
  # identical regardless of which interpreter builds it — repeating the
  # Reflex SPA + package build per matrix leg only burned extra compute.
  build-wheel:
    name: Build Container Wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [config, tests-gate]
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Python and UV
      uses: ./.github/actions/setup-uv-cached
      with:
        cache-key: container-build-wheel-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        fail-on-cache-miss: false

    - name: Setup Bun (for UI static bundle)
      # Bun is required to compile the Reflex SPA bundle during `make build`.
      # Without it the wheel ships no _static/ directory and the container starts
      # in embedded mode with a missing SPA — a non-bootable signed image (H2).
      # This mirrors the prod-release.yml build-wheel pattern for prod/dev parity.
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
      with:
        bun-version: "1.4.0"  # pinned; update intentionally to avoid surprise breakage

    # Restores the SPA's installed frontend packages (and reflex's own install
    # fingerprint) so reflex's internal `bun install` can skip straight to its
    # build step instead of redownloading ~280 packages every run. Keyed on
    # the lockfile/manifest reflex installs from plus uv.lock (which pins the
    # reflex version); never on build output, which is excluded before saving
    # below and always regenerated fresh regardless of cache state.
    - name: Restore SPA frontend dependencies cache
      id: spa-web-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
      with:
        path: src/orb/ui/.web
        key: spa-web-${{ runner.os }}-bun1.4.0-${{ hashFiles('src/orb/ui/reflex.lock/bun.lock', 'src/orb/ui/reflex.lock/package.json', 'uv.lock') }}

    - name: Build package wheel
      # The SPA bundle is built by build.sh's explicit step (python -m build
      # no longer triggers it via the editable-install hook). ORB_SKIP_UI_BUILD
      # is NOT set so the wheel ships the _static/ directory — identical to
      # the prod-release.yml wheel.
      run: make build

    - name: Save SPA frontend dependencies cache
      # Drop build output before saving -- it is never meant to be cached and
      # is always regenerated from scratch next run regardless.
      if: steps.spa-web-cache.outputs.cache-hit != 'true'
      run: rm -rf src/orb/ui/.web/build

    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
      if: steps.spa-web-cache.outputs.cache-hit != 'true'
      with:
        path: src/orb/ui/.web
        # Reuse the restore step's own resolved key rather than
        # re-evaluating hashFiles() here -- the build in between rewrites
        # src/orb/ui/reflex.lock/bun.lock and package.json in place (reflex
        # syncs its resolved lockfile back to them), so re-hashing now would
        # save under a key no future restore step would ever request.
        key: ${{ steps.spa-web-cache.outputs.cache-primary-key }}

    - name: Upload wheel artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
      with:
        name: container-wheel-${{ github.run_id }}
        path: dist/*.whl
        retention-days: 1

  # Pull requests and non-main dispatches: build and scan only. Read-only permissions, no registry
  # login, no push and no cache write.
  container-build:
    name: Build and Scan Container Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [config, build-wheel]
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')

    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.config.outputs.python-versions) }}

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

    - name: Download wheel artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
      with:
        name: container-wheel-${{ github.run_id }}
        path: dist/

    - name: Build and scan container image
      uses: ./.github/actions/container-build
      with:
        python-version: ${{ matrix.python-version }}
        push: 'false'
        cache-to: 'false'
        registry: ${{ needs.config.outputs.container-registry }}
        image-name: ${{ needs.config.outputs.container-image }}
        version: ${{ needs.config.outputs.package-version }}
        build-platforms: ${{ needs.config.outputs.build-platforms }}
        package-name-short: ${{ needs.config.outputs.short-name }}
        scan-level: ${{ matrix.python-version == needs.config.outputs.default-python-version && 'full' || 'basic' }}
        run-hadolint: ${{ matrix.python-version == needs.config.outputs.default-python-version && 'true' || 'false' }}

  # Pushes and signs images. Runs only for a push to main or develop, or a
  # manual dispatch on main, and never on pull_request.
  container-publish:
    name: Publish and Scan Container Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [config, calculate-tags, build-wheel, tests-gate]
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')

    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.config.outputs.python-versions) }}

    permissions:
      contents: read
      packages: write
      security-events: write
      # Required for keyless cosign signing (ambient OIDC token) and
      # actions/attest-build-provenance on pushed images.
      id-token: write
      attestations: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      with:
        platforms: ${{ needs.config.outputs.build-platforms }}

    - name: Log in to Container Registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
      with:
        registry: ${{ needs.config.outputs.container-registry }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Download wheel artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
      with:
        name: container-wheel-${{ github.run_id }}
        path: dist/

    - name: Build, push and scan container image
      id: build
      uses: ./.github/actions/container-build
      with:
        python-version: ${{ matrix.python-version }}
        # Only a manual dispatch can opt out of pushing.
        push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_images }}
        cache-to: 'true'
        registry: ${{ needs.config.outputs.container-registry }}
        image-name: ${{ needs.config.outputs.container-image }}
        version: ${{ needs.config.outputs.package-version }}
        build-platforms: ${{ needs.config.outputs.build-platforms }}
        package-name-short: ${{ needs.config.outputs.short-name }}
        scan-level: ${{ matrix.python-version == needs.config.outputs.default-python-version && 'full' || 'basic' }}
        run-hadolint: ${{ matrix.python-version == needs.config.outputs.default-python-version && 'true' || 'false' }}

    - name: Install cosign
      if: steps.build.outputs.pushed == 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

    - name: Sign container image (keyless / OIDC)
      if: steps.build.outputs.pushed == 'true'
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
        IMAGE: ${{ steps.build.outputs.image }}
      run: cosign sign --yes "$IMAGE@$DIGEST"

    - name: Attach SLSA provenance attestation
      if: steps.build.outputs.pushed == 'true'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
      with:
        subject-name: ${{ steps.build.outputs.image }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true

  container-manifest:
    name: Create Multi-Architecture Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [config, calculate-tags, container-publish]
    # 'release' is not a trigger for this workflow so the disjunct was dead; keep only the main-branch guard.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
    - name: Log in to Container Registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
      with:
        registry: ${{ needs.config.outputs.container-registry }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create primary tag manifests
      env:
        REGISTRY: ${{ needs.config.outputs.container-registry }}
        IMAGE: ${{ needs.config.outputs.container-image }}
        VERSION: ${{ needs.config.outputs.package-version }}
        DEFAULT_PYTHON: ${{ needs.config.outputs.default-python-version }}
        PRIMARY_TAGS: ${{ needs.calculate-tags.outputs.primary-tags }}
        PYTHON_TAGS: ${{ needs.calculate-tags.outputs.python-tags }}
      run: |
        # Create primary tags (latest, X.Y.Z) -> point to default Python
        if [[ -n "$PRIMARY_TAGS" ]]; then
          IFS=',' read -ra TAGS <<< "$PRIMARY_TAGS"
          for tag in "${TAGS[@]}"; do
            echo "Creating primary tag: $tag -> $VERSION-python$DEFAULT_PYTHON"
            docker buildx imagetools create \
              -t "$REGISTRY/$IMAGE:$tag" \
              "$REGISTRY/$IMAGE:$VERSION-python$DEFAULT_PYTHON"
          done
        fi
        
        # Create Python variant tags (pythonX.Y) -> point to specific Python latest
        if [[ -n "$PYTHON_TAGS" ]]; then
          IFS=',' read -ra TAGS <<< "$PYTHON_TAGS"
          for tag in "${TAGS[@]}"; do
            py_ver=${tag#python}
            echo "Creating Python variant tag: $tag -> $VERSION-python$py_ver"
            docker buildx imagetools create \
              -t "$REGISTRY/$IMAGE:$tag" \
              "$REGISTRY/$IMAGE:$VERSION-python$py_ver"
          done
        fi

  container-validation:
    name: Validate Container Tags
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [config, calculate-tags, container-publish, container-manifest]
    # 'release' is not a trigger for this workflow so the disjunct was dead; keep only the main-branch guard.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: read

    steps:
    - name: Log in to Container Registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
      with:
        registry: ${{ needs.config.outputs.container-registry }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Test primary tags
      env:
        REGISTRY: ${{ needs.config.outputs.container-registry }}
        IMAGE: ${{ needs.config.outputs.container-image }}
        PRIMARY_TAGS: ${{ needs.calculate-tags.outputs.primary-tags }}
        PYTHON_TAGS: ${{ needs.calculate-tags.outputs.python-tags }}
      run: |
        # Test primary tags can be pulled and work
        if [[ -n "$PRIMARY_TAGS" ]]; then
          IFS=',' read -ra TAGS <<< "$PRIMARY_TAGS"
          for tag in "${TAGS[@]}"; do
            echo "Testing primary tag: $tag"
            docker pull "$REGISTRY/$IMAGE:$tag"
            docker run --rm "$REGISTRY/$IMAGE:$tag" version
            echo "Primary tag $tag works"
          done
        fi
        
        # Test Python variant tags
        if [[ -n "$PYTHON_TAGS" ]]; then
          IFS=',' read -ra TAGS <<< "$PYTHON_TAGS"
          for tag in "${TAGS[@]}"; do
            echo "Testing Python variant tag: $tag"
            docker pull "$REGISTRY/$IMAGE:$tag"
            docker run --rm "$REGISTRY/$IMAGE:$tag" version
            echo "Python variant tag $tag works"
          done
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

    - name: Test multi-architecture support
      env:
        REGISTRY: ${{ needs.config.outputs.container-registry }}
        IMAGE: ${{ needs.config.outputs.container-image }}
        VERSION: ${{ needs.config.outputs.package-version }}
        DEFAULT_PYTHON: ${{ needs.config.outputs.default-python-version }}
        BUILD_PLATFORMS: ${{ needs.config.outputs.build-platforms }}
      run: |
        # Use buildx imagetools rather than `docker manifest inspect`:
        # imagetools authenticates via the existing docker login session and
        # handles both OCI and Docker manifest media types consistently for
        # GHCR-hosted images.
        REF="$REGISTRY/$IMAGE:$VERSION-python$DEFAULT_PYTHON"
        echo "Testing multi-arch manifest for $REF"
        INSPECT=$(docker buildx imagetools inspect --raw "$REF")
        echo "$INSPECT"

        # Derive expected arch list from BUILD_PLATFORMS (single source of truth).
        # BUILD_PLATFORMS is a comma-separated list of "os/arch" pairs, e.g.
        # "linux/amd64,linux/arm64".  Extract the arch component of each pair.
        MISSING=0
        IFS=',' read -ra PLATFORMS <<< "$BUILD_PLATFORMS"
        for platform in "${PLATFORMS[@]}"; do
          arch="${platform##*/}"
          if echo "$INSPECT" | jq -e --arg arch "$arch" \
              '.manifests[]?.platform.architecture == $arch' | grep -q true; then
            echo "Found architecture: $arch"
          else
            echo "ERROR: architecture missing from manifest: $arch"
            MISSING=1
          fi
        done
        if [[ "$MISSING" -eq 1 ]]; then
          echo "Multi-arch manifest missing one or more expected architectures"
          exit 1
        fi
        echo "Multi-arch manifest contains all expected architectures"

