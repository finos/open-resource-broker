# GitHub Labels Configuration
# Use with: gh label sync --file .github/labels.yml

# Release Management
- name: "release"
  color: "0366d6"
  description: "Release-related issues and PRs"

- name: "alpha"
  color: "f9d0c4"
  description: "Alpha release"

- name: "beta"
  color: "d4c5f9"
  description: "Beta release"

- name: "rc"
  color: "c5f9d4"
  description: "Release candidate"

- name: "stable"
  color: "0e8a16"
  description: "Stable release"

# Automation
- name: "automated"
  color: "ededed"
  description: "Automated processes and PRs"

- name: "changelog"
  color: "0366d6"
  description: "Changelog updates"

- name: "weekly"
  color: "fbca04"
  description: "Weekly automated processes"

# Workflow States
- name: "pending-review"
  color: "fbca04"
  description: "Awaiting review or approval"

- name: "ready-to-merge"
  color: "0e8a16"
  description: "Ready for merging"

- name: "triage"
  color: "d93f0b"
  description: "Needs triage"

- name: "integration"
  color: "1d76db"
  description: "New provider or scheduler integration"

# Type
- name: "type: bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "type: enhancement"
  color: "a2eeef"
  description: "New feature or request"

- name: "type: security"
  color: "b60205"
  description: "Security issue or hardening"

- name: "type: documentation"
  color: "0075ca"
  description: "Documentation changes"

- name: "type: testing"
  color: "bfd4f2"
  description: "Test coverage or test infrastructure"

- name: "type: tech-debt"
  color: "cfd3d7"
  description: "Refactoring or technical debt"

- name: "type: research"
  color: "d4c5f9"
  description: "Research spike or design investigation"

