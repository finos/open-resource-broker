name: 'Setup UV with Cache'
description: 'Install UV and restore cached environment, syncing only the requested dependency group'
inputs:
  python-version:
    description: 'Python version used to create the cached environment'
    required: false
    default: '3.12'
  cache-key:
    description: 'Cache key for UV environment (caller-supplied; keyed per group)'
    required: true
  group:
    description: >-
      PEP 735 dependency-group to sync (e.g. lint, typecheck, arch, test, docs,
      security, build, ci, dev).  When supplied the action runs
      `uv sync --frozen --no-default-groups --group <group>` on a cache miss so
      each job installs only the packages it needs.  When empty the action falls
      back to `uv sync --frozen --all-groups` (preserves legacy callers that
      have not yet been updated to pass a group).
    required: false
    default: ''
  extra:
    description: >-
      Optional project extra to install alongside the dependency group (for
      example, test-azure for the Azure provider test leg).
    required: false
    default: ''
  fail-on-cache-miss:
    description: 'Whether to fail if cache is not found'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Install UV
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

    - name: Setup Python
      id: setup-python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Restore UV environment
      id: restore-cache
      # Combined restore + post-run save (not restore-only): each job that
      # installs on a miss saves its populated environment back under this key,
      # so the cache warms itself with no separate priming job.  On an exact-key
      # hit the action skips the save automatically.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
      with:
        path: |
          .venv
          ~/.cache/uv
          ~/.local/bin/uv
          /opt/hostedtoolcache/uv
        # The virtualenv holds symlinks into the runner's hosted Python, so the
        # key carries the exact interpreter version (major.minor.patch).  A
        # runner image that moves to a new patch release then misses and
        # rebuilds instead of restoring a venv whose interpreter is gone.
        key: ${{ inputs.cache-key }}-${{ steps.setup-python.outputs.python-version }}
        fail-on-cache-miss: ${{ inputs.fail-on-cache-miss }}

    - name: Check restored environment
      id: venv-check
      if: steps.restore-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        if .venv/bin/python -c 'import sys' >/dev/null 2>&1; then
          echo "healthy=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Restored .venv interpreter is not runnable; rebuilding"
          rm -rf .venv
          echo "healthy=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install dependencies (scoped, on cache miss or unusable restore)
      if: steps.restore-cache.outputs.cache-hit != 'true' || steps.venv-check.outputs.healthy != 'true'
      shell: bash
      env:
        ORB_SKIP_UI_BUILD: "1"
        UV_GROUP: ${{ inputs.group }}
        UV_EXTRA: ${{ inputs.extra }}
      run: |
        if [ -n "$UV_GROUP" ] && [ -n "$UV_EXTRA" ]; then
          uv sync --frozen --no-default-groups --group "$UV_GROUP" --extra "$UV_EXTRA"
        elif [ -n "$UV_GROUP" ]; then
          # Scoped install: only the packages this job needs (~2-15 pkgs, fast even cold)
          uv sync --frozen --no-default-groups --group "$UV_GROUP"
        elif [ -n "$UV_EXTRA" ]; then
          uv sync --frozen --no-default-groups --extra "$UV_EXTRA"
        else
          # Legacy fallback: full install (used by callers that predate group scoping)
          uv sync --frozen --all-groups
        fi
