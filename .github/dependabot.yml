version: 2
updates:
  # Python dependencies using UV
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 3

    # Group related dependencies together
    groups:
      aws-dependencies:
        patterns:
          - "boto*"
          - "aws-*"
          - "moto*"
        update-types:
          - "minor"
          - "patch"

      dev-tools:
        patterns:
          - "black"
          - "isort"
          - "mypy"
          - "pylint"
          - "flake8"
          - "autopep8"
          - "ruff"
        update-types:
          - "minor"
          - "patch"

      testing-tools:
        patterns:
          - "pytest*"
          - "coverage"
          - "tox"
        update-types:
          - "minor"
          - "patch"

    # Ignore problematic updates
    ignore:
      # Don't update major versions automatically for critical tools
      - dependency-name: "black"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pytest"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"

  # Go dependencies (SDK)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 2

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 1

  # TypeScript SDK dependencies
  - package-ecosystem: "npm"
    directory: "/sdk/typescript"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "typescript"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 2
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # ts-jest's peer range does not yet include TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
