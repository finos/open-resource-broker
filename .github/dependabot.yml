version: 2
updates:
  # Python dependencies using UV
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      python-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      python-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # Don't update major versions automatically for critical tools
      - dependency-name: "black"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pytest"
        update-types: ["version-update:semver-major"]
      # The MCP SDK's major versions change the protocol/API and need a planned migration.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
      # kubernetes 37 validates models strictly; adopting it is a separate change.
      - dependency-name: "kubernetes"
        update-types: ["version-update:semver-major"]
      - dependency-name: "kubernetes-stubs-elephant-fork"
        update-types: ["version-update:semver-major"]
      # filelock 4.x is currently flagged by dependency review.
      - dependency-name: "filelock"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"

  # Go dependencies (SDK)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      go-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      go-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      go-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"

  # Docker dependencies
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/dev-tools/docker"
      - "/sdk/java"
      - "/tests/e2e/microvm/worker"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    ignore:
      # Keep the Java build image on a deliberately chosen LTS; do not follow the
      # latest (non-LTS) JDK major automatically.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      docker-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      docker-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"

  # Java SDK dependencies (Gradle)
  - package-ecosystem: "gradle"
    directory: "/sdk/java"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      java-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      java-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      java-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"

  # Kotlin SDK dependencies (Gradle)
  - package-ecosystem: "gradle"
    directory: "/sdk/kotlin"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      kotlin-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      kotlin-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      kotlin-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # coroutines 1.11 is built with Kotlin 2.2; the build pins Kotlin 1.9.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-core"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-test"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # okio 3.10+ is built with Kotlin 2.x metadata; the build pins Kotlin 1.9.
      - dependency-name: "com.squareup.okio:okio"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # mockk 1.14 requires Kotlin 2.2 metadata; the build pins Kotlin 1.9.
      - dependency-name: "io.mockk:mockk"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "com.squareup.okhttp3:okhttp"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.squareup.okhttp3:logging-interceptor"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.squareup.okhttp3:mockwebserver"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.junit:junit-bom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jvm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]

  # C# SDK dependencies (NuGet)
  - package-ecosystem: "nuget"
    directories:
      - "/sdk/csharp/src/FINOS.OpenResourceBroker"
      - "/sdk/csharp/tests/unit"
      - "/sdk/csharp/tests/contract"
      - "/sdk/csharp/tests/parity"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      csharp-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      csharp-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      csharp-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"

  # TypeScript SDK dependencies
  - package-ecosystem: "npm"
    directory: "/sdk/typescript"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "typescript"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      typescript-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      typescript-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      typescript-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # ts-jest's peer range does not yet include TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Keep @types/node aligned with the minimum supported Node version
      # rather than tracking Node's latest major automatically.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
