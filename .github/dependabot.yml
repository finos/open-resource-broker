version: 2
updates:
  # Python dependencies using UV
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 2

    # Bundle all minor/patch bumps into one weekly PR, and all major bumps
    # into a second weekly PR, instead of one PR per package. Security
    # updates are left ungrouped so they are never delayed behind a
    # resolver conflict in either batch.
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      python-major:
        patterns:
          - "*"
        update-types:
          - "major"

    # Ignore problematic updates
    ignore:
      # Don't update major versions automatically for critical tools
      - dependency-name: "black"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pytest"
        update-types: ["version-update:semver-major"]
      # The MCP SDK's major versions change the protocol/API and need a planned migration.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 1
    groups:
      github-actions-all:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # Go dependencies (SDK)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 1
    groups:
      go-all:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # Docker dependencies
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/dev-tools/docker"
      - "/sdk/java"
      - "/tests/e2e/microvm/worker"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 1
    groups:
      docker-all:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # Java SDK dependencies (Gradle)
  - package-ecosystem: "gradle"
    directory: "/sdk/java"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 1
    groups:
      java-all:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # Kotlin SDK dependencies (Gradle)
  - package-ecosystem: "gradle"
    directory: "/sdk/kotlin"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "kotlin"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 1
    groups:
      kotlin-all:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # C# SDK dependencies (NuGet)
  - package-ecosystem: "nuget"
    directories:
      - "/sdk/csharp/src/FINOS.OpenResourceBroker"
      - "/sdk/csharp/tests/unit"
      - "/sdk/csharp/tests/contract"
      - "/sdk/csharp/tests/parity"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "csharp"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 1
    groups:
      csharp-all:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # TypeScript SDK dependencies
  - package-ecosystem: "npm"
    directory: "/sdk/typescript"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "typescript"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 2
    groups:
      typescript-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      typescript-major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # ts-jest's peer range does not yet include TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Keep @types/node aligned with the minimum supported Node version
      # rather than tracking Node's latest major automatically.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
