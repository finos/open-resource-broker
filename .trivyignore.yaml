      which requires Python >= 3.11; Python 3.10 resolves 4.1.0.
    expired_at: 2027-01-27

  - id: CVE-2026-112913
    purls:
      - pkg:pypi/filelock@4.1.0
    statement: >-
      filelock (GHSA-9vhv-jxww-xfm5): ReadWriteLock on Windows acts on SQLite side files another
      local user places beside its database. Fixed only in filelock >= 4.2.1, which requires Python
      >= 3.11; Python 3.10 resolves 4.1.0.
    expired_at: 2027-01-27

  - id: CVE-2026-112941
    purls:
      - pkg:pypi/filelock@4.1.0
    statement: >-
      filelock (GHSA-wfhq-q4j2-c37m): SoftReadWriteLock follows a lock tree swapped in after its
      first acquire and writes lock records into directories of the user running the lock. Fixed
      only in filelock >= 4.2.1, which requires Python >= 3.11; Python 3.10 resolves 4.1.0.
    expired_at: 2027-01-27

secrets:
  # moto (AWS mocking library) ships fixed self-signed TLS certificates for
  # its local mock proxy server. They are test fixtures, not production
  # credentials, so the private-key finding is suppressed for these two
  # files only.
  - id: private-key
    paths:
      - "**/.venv/lib/python*/site-packages/moto/moto_proxy/ca.key"
      - "**/.venv/lib/python*/site-packages/moto/moto_proxy/cert.key"
      - ".venv/lib/python*/site-packages/moto/moto_proxy/ca.key"
      - ".venv/lib/python*/site-packages/moto/moto_proxy/cert.key"
    statement: >-
      Fixed self-signed test certificate shipped with moto for AWS mocking;
      not a production credential.
