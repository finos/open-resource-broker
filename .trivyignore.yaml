# Trivy ignore file for security scanning exceptions.
# Loaded explicitly via `trivyignores:` / `--ignorefile` by each workflow that
# runs a Trivy filesystem or container-image scan.
#
# Schema: https://trivy.dev/latest/docs/configuration/filtering/#trivyignoreyaml

vulnerabilities:
  # ── Debian 13 (trixie) OS-package CVEs with no upstream fix ────────────────
  #
  # These findings are in the python:3.X-slim base image. The Dockerfile already
  # runs `apt-get upgrade -y`, so every Debian patch available at build time is
  # applied. Each entry is scoped to the affected Debian binary packages with
  # purls and is suppressed only because the Debian security tracker
  # (https://security-tracker.debian.org/tracker/<CVE>) lists the trixie source
  # package as "vulnerable" with no fixed version for trixie. Each entry expires
  # on its own: re-check the tracker, and drop the entry as soon as a fixed
  # trixie package exists.

  - id: CVE-2025-69720
    purls:
      - pkg:deb/debian/libncursesw6
      - pkg:deb/debian/libtinfo6
      - pkg:deb/debian/ncurses-base
      - pkg:deb/debian/ncurses-bin
    statement: >-
      ncurses: ncurses: Buffer overflow vulnerability may lead to arbitrary code execution. Debian
      security tracker lists no fixed version for trixie (source package ncurses, trixie
      6.5+20250216-2: vulnerable; checked 2026-10-29).
