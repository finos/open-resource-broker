# Trivy ignore file for security scanning exceptions.
# Loaded explicitly via `trivyignores:` / `--ignorefile` by each workflow that
# runs a Trivy filesystem or container-image scan.
#
# Schema: https://trivy.dev/latest/docs/configuration/filtering/#trivyignoreyaml

vulnerabilities:
  # ── Debian 13 (trixie) OS-package CVEs with no upstream fix ────────────────
  #
  # All findings below are in the python:3.X-slim base image (Debian 13.6 for
  # 3.14, Debian 13.4 for older variants). The Dockerfile already runs
  # `apt-get upgrade -y` so every Debian patch available at build time is
  # applied. Each entry is suppressed only because Debian has not yet
  # published a fixed package version for Debian 13 specifically (status
  # "affected", no Fixed Version in the Trivy report). Re-evaluate on every
  # release and drop the entry as soon as a fixed Debian 13 package is
  # available.

  - id: CVE-2025-69720
    statement: >-
      Buffer overflow in ncurses (libncursesw6 / libtinfo6 / ncurses-base /
      ncurses-bin) that may lead to arbitrary code execution. No fixed
      package in Debian 13.
    expired_at: 2027-01-01

  - id: CVE-2026-54369
    statement: >-
      Symlink traversal privilege escalation via libacl1 functions. No fixed
      package in Debian 13.
    expired_at: 2027-01-01

  - id: CVE-2026-9538
    statement: >-
      perl-base (perl-IO-Compress): denial of service via a crafted tar
      header. No fixed package in Debian 13; status "fix_deferred".
    expired_at: 2027-01-01

  - id: CVE-2026-76642
    statement: >-
      util-linux: a failed external mount helper still runs privileged
      X-mount post-hooks (bsdutils, libblkid1, liblastlog2-2, libmount1,
      libsmartcols1, libuuid1, login, mount, util-linux). No fixed package
      in Debian 13.
    expired_at: 2027-01-01

  - id: CVE-2026-78408
    statement: >-
      util-linux: nsenter --join-cgroup leaks root cgroup migration
      authority (bsdutils, libblkid1, liblastlog2-2, libmount1,
      libsmartcols1, libuuid1, login, mount, util-linux). No fixed package
      in Debian 13.
    expired_at: 2027-01-01

  - id: CVE-2026-78409
    statement: >-
      util-linux: X-mount.subdir detached-tree resolution can escape via
      intermediate symlinks (bsdutils, libblkid1, liblastlog2-2, libmount1,
      libsmartcols1, libuuid1, login, mount, util-linux). No fixed package
      in Debian 13.
    expired_at: 2027-01-01

  - id: CVE-2026-78410
    statement: >-
      util-linux: restricted bind mounts do not pin the source, allowing
      X-mount.owner/group/mode changes to escape the restriction (bsdutils,
      libblkid1, liblastlog2-2, libmount1, libsmartcols1, libuuid1, login,
      mount, util-linux). No fixed package in Debian 13.
    expired_at: 2027-01-01

  - id: CVE-2026-16742
    statement: >-
      systemd-homed: local privilege escalation (libsystemd0, libudev1).
      No fixed package in Debian 13.
    expired_at: 2027-01-01

  # ── filelock ───────────────────────────────────────────────────────────────
  #
  # Every filelock fix is in 4.2.1 or later, and those releases require
  # Python >= 3.11, while orb-py supports Python 3.10 (the newest
  # 3.10-compatible release, 4.1.0, is still affected). All advisories below
  # concern ReadWriteLock or SoftFileLock and need a local user with write
  # access to the lock directory. orb-py does not use either class; its own
  # code only uses the plain FileLock (live test helpers), and the other
  # dependents (cachecontrol, virtualenv, python-discovery) are dev tooling
  # that also only use FileLock. Re-evaluate when Python 3.10 support ends.

  - id: CVE-2026-112940
    purls:
      - pkg:pypi/filelock
    statement: >-
      filelock (GHSA-v4x8-3wr5-3wq8): ReadWriteLock reopens its SQLite lock database by name, so a local user who can write to the lock directory can plant a symlink or journal file. Fixed only in
      filelock >= 4.2.1, which requires Python >= 3.11. Not used by orb-py.
    expired_at: 2027-01-01

  - id: CVE-2026-112937
    purls:
      - pkg:pypi/filelock
    statement: >-
      filelock (GHSA-jqc4-5cvw-7w85): ReadWriteLock's hard-link route recursively deletes a path another local user can rename onto its link directory name. Fixed only in
      filelock >= 4.2.1, which requires Python >= 3.11. Not used by orb-py.
    expired_at: 2027-01-01

  - id: CVE-2026-112914
    purls:
      - pkg:pypi/filelock
    statement: >-
      filelock (GHSA-crv4-6mhj-j5jh): SoftFileLock stale-break restore follows a swapped-in symlink in a shared lock directory. Fixed only in
      filelock >= 4.2.1, which requires Python >= 3.11. Not used by orb-py.
    expired_at: 2027-01-01

  - id: CVE-2026-112906
    purls:
      - pkg:pypi/filelock
    statement: >-
      filelock (GHSA-2g95-wg33-c5x2): SoftFileLock can evict a fresh lock file through inode reuse by another local user. Fixed only in
      filelock >= 4.2.1, which requires Python >= 3.11. Not used by orb-py.
    expired_at: 2027-01-01

  - id: CVE-2026-112907
    purls:
      - pkg:pypi/filelock
    statement: >-
      filelock (GHSA-567q-5qvw-pf92): Windows-only SoftFileLock oplock hang. Fixed only in
      filelock >= 4.2.1, which requires Python >= 3.11. Not used by orb-py.
    expired_at: 2027-01-01

  - id: CVE-2026-112913
    purls:
      - pkg:pypi/filelock
    statement: >-
      filelock (GHSA-9vhv-jxww-xfm5): Windows-only ReadWriteLock side-file issue. Fixed only in
      filelock >= 4.2.1, which requires Python >= 3.11. Not used by orb-py.
    expired_at: 2027-01-01

secrets:
  # moto (AWS mocking library) ships fixed self-signed TLS certificates for
  # its local mock proxy server. They are test fixtures, not production
  # credentials, so the private-key finding is suppressed for these two
  # files only.
  - id: private-key
    paths:
      - "**/.venv/lib/python*/site-packages/moto/moto_proxy/ca.key"
      - "**/.venv/lib/python*/site-packages/moto/moto_proxy/cert.key"
      - ".venv/lib/python*/site-packages/moto/moto_proxy/ca.key"
      - ".venv/lib/python*/site-packages/moto/moto_proxy/cert.key"
    statement: >-
      Fixed self-signed test certificate shipped with moto for AWS mocking;
      not a production credential.
