  # ── filelock on Python 3.10 ────────────────────────────────────────────────
  #
  # Python 3.10 resolves filelock to 4.1.0, the newest release that supports it;
  # every fix is in 4.2.1, which requires Python >= 3.11. Python 3.11 and later
  # resolve filelock 4.2.4, so these entries are scoped to the exact 4.1.0 purl
  # and do not apply there. The advisories concern ReadWriteLock, SoftFileLock,
  # StrictSoftFileLock, UnixFileLock and WindowsFileLock and need a local user
  # with write access to the lock directory. No module under src/ imports
  # filelock; the only direct use in the repository is the plain FileLock in the
  # live k8s test helpers.

  - id: CVE-2026-112940
    purls:
      - pkg:pypi/filelock@4.1.0
    statement: >-
      filelock (GHSA-v4x8-3wr5-3wq8): filelock ReadWriteLock: SQLite reopens the lock database by
      name, so a planted symlink or journal file makes the lock user's process overwrite or unlink
      its own files. Fixed only in filelock >= 4.2.1, which requires Python >= 3.11; Python 3.10
      resolves 4.1.0.
    expired_at: 2027-01-27

  - id: CVE-2026-112906
    purls:
      - pkg:pypi/filelock@4.1.0
    statement: >-
      filelock (GHSA-2g95-wg33-c5x2): SoftFileLock evicts a fresh lock file whose watched age
      another local user's pre-dated file passed on through inode reuse. Fixed only in filelock >=
      4.2.1, which requires Python >= 3.11; Python 3.10 resolves 4.1.0.
    expired_at: 2027-01-27

  - id: CVE-2026-112908
    purls:
      - pkg:pypi/filelock@4.1.0
    statement: >-
      filelock (GHSA-6627-m3xw-93mp): StrictSoftFileLock creates its claim directories without the
      lock mode, so another local user with a write bit on them can end a live hold. Fixed only in
      filelock >= 4.2.1, which requires Python >= 3.11; Python 3.10 resolves 4.1.0.
    expired_at: 2027-01-27

  - id: CVE-2026-112909
    purls:
      - pkg:pypi/filelock@4.1.0
    statement: >-
      filelock (GHSA-69hj-f68j-2879): UnixFileLock truncates and chmods any regular file another
      user renames or hard-links onto the lock path. Fixed only in filelock >= 4.2.1, which requires
      Python >= 3.11; Python 3.10 resolves 4.1.0.
    expired_at: 2027-01-27

  - id: CVE-2026-112910
    purls:
      - pkg:pypi/filelock@4.1.0
    statement: >-
      filelock (GHSA-8mx5-7m5m-r77g): WindowsFileLock ignores mode: a 0o600 lock file and the
      ReadWriteLock database inherit the directory ACL. Fixed only in filelock >= 4.2.1, which
      requires Python >= 3.11; Python 3.10 resolves 4.1.0.
    expired_at: 2027-01-27

  - id: CVE-2026-112911
    purls:
      - pkg:pypi/filelock@4.1.0
    statement: >-
      filelock (GHSA-9c4x-gm8v-wgc4): StrictSoftFileLock and SoftReadWriteLock adopt a protocol
      directory another user created first, losing mutual exclusion. Fixed only in filelock >=
      4.2.1, which requires Python >= 3.11; Python 3.10 resolves 4.1.0.
    expired_at: 2027-01-27

  - id: CVE-2026-112914
    purls:
      - pkg:pypi/filelock@4.1.0
    statement: >-
      filelock (GHSA-crv4-6mhj-j5jh): SoftFileLock stale-break restore follows a swapped-in symbolic
      link and hard-links a file of the user running the lock into the lock directory. Fixed only in
      filelock >= 4.2.1, which requires Python >= 3.11; Python 3.10 resolves 4.1.0.
    expired_at: 2027-01-27

  - id: CVE-2026-112915
    purls:
      - pkg:pypi/filelock@4.1.0
    statement: >-
      filelock (GHSA-cwqr-hh33-gh44): filelock ReadWriteLock: a crafted lock database makes every
      acquire stall or hang regardless of timeout. Fixed only in filelock >= 4.2.1, which requires
      Python >= 3.11; Python 3.10 resolves 4.1.0.
    expired_at: 2027-01-27

  - id: CVE-2026-112934
    purls:
      - pkg:pypi/filelock@4.1.0
    statement: >-
      filelock (GHSA-fj95-fr6c-h845): SoftReadWriteLock holder refresh writes through a hard link
      and hangs on a named pipe that another local user renames over its record. Fixed only in
      filelock >= 4.2.1, which requires Python >= 3.11; Python 3.10 resolves 4.1.0.
